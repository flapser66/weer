name: Publiceren naar Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server-onderdelen installeren
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - name: Sleutel klaarzetten
        run: echo "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publiceren (website, server, database-regels)
        run: npx --yes firebase-tools@13 deploy --only hosting,functions,firestore:rules --project weer-jasper --force --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
