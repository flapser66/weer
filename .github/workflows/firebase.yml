name: Publiceren naar Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server-onderdelen installeren
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - name: Sleutel klaarzetten
        run: echo "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publiceren (website, server, database-regels)
        shell: bash
        run: |
          set +e
          npx --yes firebase-tools@latest deploy --only hosting,functions,firestore:rules --project weer-jasper --force --non-interactive 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then grep -iE 'error|denied|permission|failed|must|requires|billing' deploy.log | grep -v '^\s*$' | tail -n 9 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
