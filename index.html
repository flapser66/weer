<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weer</title>
<meta name="theme-color" content="#060b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg1:#2f6fb5; --bg2:#7fb6e6;
  --card:color-mix(in srgb,var(--bg1) 78%,#000); --card-b:rgba(255,255,255,.07); --cloud:rgba(255,255,255,.9);
  --text:#fff; --muted:rgba(255,255,255,.72); --faint:rgba(255,255,255,.45);
  --rain:#8fd2ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bg1)}
#sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#sky svg{position:absolute;fill:var(--cloud);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:var(--bg1);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--card-b)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* hero */
.hero{text-align:center;padding:10px 0 26px}
.place{font-size:30px;font-weight:500;letter-spacing:.2px;display:flex;align-items:center;justify-content:center;gap:6px}
.place svg{width:16px;height:16px;opacity:.85}
.temp{font-size:96px;font-weight:200;line-height:1;margin:4px 0 2px 22px}
.cond{font-size:20px;font-weight:500}
.hilo{font-size:18px;font-weight:500;margin-top:4px}
.updated{font-size:12px;color:var(--faint);margin-top:8px}

/* cards */
.card{background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card h2{white-space:nowrap;overflow:hidden;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:10px}
.card h2 svg{width:14px;height:14px}
.summary{font-size:15px;line-height:1.35;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:10px}

/* hourly */
.hours{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none;margin:0 -6px}
.hours::-webkit-scrollbar{display:none}
.hour{flex:0 0 auto;min-width:54px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 4px}
.hour .t{font-size:14px;font-weight:600}
.hour .ic{font-size:26px;line-height:30px;height:30px}
.hour .p{font-size:11px;font-weight:600;color:var(--rain);height:13px}
.hour .v{font-size:18px;font-weight:500}
.hour.sun .v{font-size:13px;font-weight:600;padding-top:4px}

/* rain 2h */
.rainchart{display:flex;align-items:flex-end;gap:2px;height:84px;padding-top:4px;position:relative}
.rainchart .bar{flex:1;background:var(--rain);border-radius:3px 3px 0 0;min-height:2px;opacity:.95}
.rainchart .bar.zero{background:rgba(255,255,255,.18)}
.rainlines{position:absolute;inset:4px 0 0 0;pointer-events:none}
.rainlines div{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.18);font-size:9px;color:var(--faint);text-align:right}
.rainaxis{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:4px}
.rainaxis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.rainaxis span.first{transform:none}.rainaxis span.last{transform:translateX(-100%)}
.rainticks{position:absolute;inset:4px 0 0 0;pointer-events:none}
.rainticks div{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.10)}
.rainspans{position:relative;height:22px;margin-top:6px}
.rainspans div{position:absolute;top:0;height:20px;border-radius:6px;background:rgba(143,210,255,.22);border:1px solid rgba(143,210,255,.55);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;white-space:nowrap;overflow:visible;min-width:4px}
.rainspans div span{position:relative;padding:0 4px}
.rainpick{font-size:13px;font-weight:600;color:var(--rain);height:17px;margin-bottom:4px}
.rainchart .bar.sel{outline:2px solid #fff;outline-offset:-1px}
.rainsrc{font-size:11px;color:var(--faint);margin-top:6px}

/* daily */
.day{display:grid;grid-template-columns:78px 30px 36px 32px 1fr 32px;align-items:center;gap:6px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}
.day:first-of-type{border-top:0}
.day .d{font-size:17px;font-weight:500}
.day .ic{font-size:24px;text-align:center}
.day .p{font-size:11px;font-weight:600;color:var(--rain);text-align:center}
.day .lo{color:var(--muted);text-align:right;font-size:17px;font-weight:500}
.day .hi{font-size:17px;font-weight:500;text-align:right}
.range{height:5px;border-radius:3px;background:rgba(0,0,0,.18);position:relative}
.range i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#8fd3ff,#a5e57a,#ffd25e,#ff9a4a)}
.range b{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25);margin-left:-4px}
.daydetail{grid-column:1/-1;font-size:13px;color:var(--muted);padding:2px 0 4px;display:none}
.day.open .daydetail{display:block}

/* radar */
.radarwrap{position:relative;border-radius:12px;overflow:hidden;height:300px;background:#1b2430}
#map{position:absolute;inset:0}
.radarwrap.full{position:fixed;inset:0;z-index:50;border-radius:0;height:auto}
.radarctl{position:absolute;left:8px;right:8px;bottom:8px;z-index:500;display:flex;align-items:center;gap:8px;background:rgba(20,28,40,.75);border-radius:12px;padding:6px 10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.radarctl input{flex:1;accent-color:#6ec3ff}
.radarctl .rt{font-size:13px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.radarctl button svg{width:22px;height:22px}
.radarfs{position:absolute;top:8px;right:8px;z-index:500;width:36px;height:36px;border-radius:10px;background:rgba(20,28,40,.75);display:grid;place-items:center}
.radarfs svg{width:18px;height:18px}
.radarwrap.full .radarctl{bottom:calc(env(safe-area-inset-bottom) + 12px)}
.radarwrap.full .radarfs{top:calc(env(safe-area-inset-top) + 12px)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.6)!important}
.leaflet-bottom.leaflet-right{bottom:52px}
.legend{position:absolute;top:8px;left:8px;z-index:500;display:flex;align-items:center;gap:6px;background:rgba(20,28,40,.75);border-radius:10px;padding:5px 8px;font-size:10px;color:#fff}
.legend i{display:block;width:70px;height:6px;border-radius:3px;background:linear-gradient(90deg,#e8ecff,#9aa8ef,#3c50d8,#1a1f9c,#c8143c)}
.brimg{image-rendering:auto}
.me{width:14px;height:14px;border-radius:50%;background:#2f8cff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,140,255,.25)}

/* tiles */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.grid .card{margin:0;min-height:150px;display:flex;flex-direction:column}
.big{font-size:32px;font-weight:500;line-height:1.1}
.sub{font-size:14px;margin-top:4px}
.note{font-size:13px;color:var(--muted);margin-top:auto;padding-top:8px;line-height:1.3}
.meter{height:5px;border-radius:3px;margin:10px 0 2px;position:relative}
.meter b{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.3);margin-left:-4px}
.uvm{background:linear-gradient(90deg,#3ec74a,#e6d83a,#f39b2b,#e5413a,#9c4bd1)}
.aqm{background:linear-gradient(90deg,#50f0e6,#50ccaa,#f0e641,#ff5050,#960032,#7d2181)}
.compass{position:relative;width:96px;height:96px;margin:4px auto 0}
.compass svg{width:100%;height:100%}
.compass .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.compass .c b{font-size:20px;font-weight:600;line-height:1}
.compass .c span{font-size:10px;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35);display:none}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 40px);max-width:560px;margin:0 auto;background:#16202c;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
.panel h3{font-size:22px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:16px;outline:none}
.search::placeholder{color:rgba(255,255,255,.5)}
.plist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);text-align:left;width:100%}
.pitem .n{flex:1}
.pitem .n div{font-size:16px;font-weight:600}
.pitem .n small{font-size:12px;color:rgba(255,255,255,.6)}
.pitem .x{opacity:.6;padding:4px 6px;font-size:18px}
.pitem svg{width:18px;height:18px;flex:0 0 auto}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.5);margin:18px 0 0}

.msg{text-align:center;padding:60px 20px;font-size:16px;line-height:1.5}
.msg button{margin-top:16px;padding:10px 18px;border-radius:12px;background:var(--card);border:1px solid var(--card-b)}
.foot{text-align:center;font-size:11px;color:var(--faint);margin-top:8px;line-height:1.6}
.foot a{color:inherit}
.hidden{display:none!important}
.warn{border-radius:18px;padding:12px 14px;margin-bottom:12px;color:#1b1b1b;cursor:pointer}
.warn.l2{background:#ffe14d}.warn.l3{background:#ff9a2e}.warn.l4{background:#ff4d4d;color:#fff}
.warn .wt{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.warn .ws{font-size:12px;opacity:.8;margin-top:2px}
.warn .wd{font-size:13px;line-height:1.35;margin-top:8px;display:none}
.warn.open .wd{display:block}
.hour .mm{font-size:10px;color:var(--rain);opacity:.85;height:12px;margin-top:-4px}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:60;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;transform:translateY(-60px);opacity:0;pointer-events:none}
.ptr svg{width:20px;height:20px;stroke:#2f6fb5}
.ptr.spin svg{animation:spin 1s linear infinite}

/* ================= FUTURISTISCH THEMA ================= */
:root{--neon:#38f3ff;--neon2:#b26bff;--rain:#38f3ff;--glass:rgba(10,18,32,.55);--hud:rgba(56,243,255,.35)}
body{font-family:"Exo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#03060c}
body::before{background:
  radial-gradient(120% 70% at 50% -10%,color-mix(in srgb,var(--bg1) 55%,transparent),transparent 70%),
  radial-gradient(80% 50% at 100% 100%,rgba(178,107,255,.18),transparent 70%),
  linear-gradient(180deg,#060b16,#02040a)}
body::after{content:"";position:fixed;left:-50%;right:-50%;bottom:0;height:45vh;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(56,243,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(56,243,255,.16) 1px,transparent 1px);
  background-size:44px 44px;transform:perspective(320px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000,transparent 85%);mask-image:linear-gradient(to top,#000,transparent 85%);
  animation:gridmove 6s linear infinite}
@keyframes gridmove{to{background-position:0 44px,0 0}}
#sky svg{fill:rgba(140,230,255,.10)!important;filter:blur(1px)}
.place,.temp,.big,.card h2,.hour .t,.day .d,.rainaxis,.radarctl .rt,.panel h3{font-family:Orbitron,sans-serif}
.place{font-size:22px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--neon);text-shadow:0 0 12px rgba(56,243,255,.6)}
.temp{font-weight:400;font-size:88px;letter-spacing:-2px;background:linear-gradient(180deg,#fff 30%,var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(56,243,255,.45))}
.cond{letter-spacing:2px;text-transform:uppercase;font-size:16px;font-weight:500}
.hilo{font-family:Orbitron,sans-serif;font-size:14px;letter-spacing:1px;color:var(--muted)}
.updated{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.card,.iconbtn,.msg button{background:var(--glass);border:1px solid var(--hud);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 0 0 1px rgba(56,243,255,.05) inset,0 0 22px rgba(56,243,255,.10),0 10px 30px rgba(0,0,0,.45)}
.card{position:relative;border-radius:6px 18px 6px 18px}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border-color:var(--neon);border-style:solid;filter:drop-shadow(0 0 4px var(--neon))}
.card::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-top-left-radius:6px}
.card::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:6px}
.iconbtn{border-radius:12px}
.iconbtn svg{stroke:var(--neon);filter:drop-shadow(0 0 4px var(--neon))}
.card h2{font-size:10px;font-weight:500;letter-spacing:2.5px;color:var(--neon);border-bottom:1px solid rgba(56,243,255,.2)}
.card h2 svg{filter:drop-shadow(0 0 3px var(--neon))}
.summary{border-bottom:1px solid rgba(56,243,255,.2)}
.hour .t{font-size:11px;letter-spacing:1px;color:var(--muted)}
.hour .v{font-family:Orbitron,sans-serif;font-size:15px}
.rainchart .bar{background:linear-gradient(180deg,var(--neon),var(--neon2));box-shadow:0 0 8px rgba(56,243,255,.55);border-radius:2px 2px 0 0}
.rainchart .bar.zero{background:rgba(56,243,255,.15);box-shadow:none}
.rainchart .bar.sel{outline:none;background:#fff;box-shadow:0 0 12px #fff}
.rainlines div{border-top-color:rgba(56,243,255,.2)}
.rainticks div{border-left-color:rgba(56,243,255,.12)}
.rainaxis{font-size:9px;letter-spacing:.5px}
.rainspans div{background:rgba(56,243,255,.12);border-color:var(--neon);box-shadow:0 0 10px rgba(56,243,255,.35);border-radius:3px;font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:.5px}
.rainpick{font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.5px;text-shadow:0 0 8px rgba(56,243,255,.6)}
.day{border-top:1px solid rgba(56,243,255,.12)}
.day .d{font-size:13px;letter-spacing:1px}
.day .lo,.day .hi{font-family:Orbitron,sans-serif;font-size:14px}
.range{background:rgba(56,243,255,.10)}
.range i{box-shadow:0 0 8px rgba(165,229,122,.5)}
.range b,.meter b{background:#fff;border:0;box-shadow:0 0 8px #fff}
.big{font-weight:500;font-size:26px;text-shadow:0 0 14px rgba(56,243,255,.4)}
.compass svg{filter:drop-shadow(0 0 4px rgba(56,243,255,.6))}
.radarwrap{border-radius:4px 14px 4px 14px;border:1px solid var(--hud)}
.radarctl,.radarfs,.legend{background:rgba(5,12,24,.8);border:1px solid var(--hud)}
.radarctl input{accent-color:var(--neon)}
.panel{background:rgba(6,12,24,.92);border-top:1px solid var(--neon);box-shadow:0 -8px 30px rgba(56,243,255,.15);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.search{background:rgba(56,243,255,.07);border:1px solid var(--hud)}
.pitem{background:rgba(56,243,255,.06);border:1px solid rgba(56,243,255,.15)}
.ptr{background:rgba(5,12,24,.9);border:1px solid var(--neon)}
.ptr svg{stroke:var(--neon)}
.foot{font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:.5px}
@media (prefers-reduced-motion:reduce){body::after{animation:none}}

/* ================= EFFECTEN ================= */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle at 50% 20%,rgba(200,230,255,.55),rgba(150,120,255,.15) 60%,transparent);opacity:0}
#flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}5%{opacity:1}12%{opacity:.2}20%{opacity:.85}100%{opacity:0}}
.scan{position:fixed;inset:0;z-index:30;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.scan::after{content:"";position:absolute;left:0;right:0;height:120px;background:linear-gradient(180deg,transparent,rgba(56,243,255,.06),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{from{transform:translateY(-120px)}to{transform:translateY(100vh)}}
.fxin{animation:fxin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fxin{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.card{overflow:hidden}
.card .shine{position:absolute;top:0;bottom:0;width:40%;left:-60%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(56,243,255,.10),rgba(255,255,255,.12),transparent);transform:skewX(-20deg);animation:shine 9s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.temp{position:relative;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 28px rgba(56,243,255,.7))}}
.temp.glitch{animation:glitch .45s steps(2) 1}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-3px,1px);text-shadow:3px 0 #ff2bd6,-3px 0 var(--neon)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,0);clip-path:inset(20% 0 40% 0)}80%{transform:translate(2px,1px);clip-path:none}100%{transform:none}}
.hero{will-change:transform}
.ripple{position:absolute;border-radius:50%;pointer-events:none;border:2px solid var(--neon);box-shadow:0 0 12px var(--neon);transform:translate(-50%,-50%);animation:ripple .6s ease-out forwards;z-index:5}
@keyframes ripple{from{width:0;height:0;opacity:1}to{width:220px;height:220px;opacity:0}}
.place svg{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%,100%{filter:drop-shadow(0 0 2px var(--neon))}50%{filter:drop-shadow(0 0 10px var(--neon))}}
.rainchart .bar{transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.card:has(.radarwrap.full){backdrop-filter:none!important;-webkit-backdrop-filter:none!important;overflow:visible;animation:none!important;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){.scan::after,.card .shine,.temp,.fxin,.rainchart .bar,.place svg{animation:none!important}}

/* ================= EFFECTEN 2 ================= */
body.shake .wrap{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-1px,1px)}20%,80%{transform:translate(3px,-2px)}30%,50%,70%{transform:translate(-5px,2px)}40%,60%{transform:translate(5px,-1px)}}
#boot{position:fixed;inset:0;z-index:200;background:#02050b;display:flex;flex-direction:column;justify-content:center;padding:0 32px;font-family:Orbitron,monospace;color:var(--neon);font-size:12px;letter-spacing:1.5px;line-height:2;text-shadow:0 0 8px rgba(56,243,255,.7);transition:opacity .45s,filter .45s}
#boot.out{opacity:0;filter:blur(8px) brightness(2);pointer-events:none}
#boot .logo{font-size:26px;font-weight:700;letter-spacing:6px;margin-bottom:18px;animation:flick 1.2s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}42%{opacity:.4}44%{opacity:1}71%{opacity:.7}72%{opacity:1}}
#boot .bar{height:3px;background:rgba(56,243,255,.15);margin-top:18px;overflow:hidden;border-radius:2px}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 10px var(--neon);transition:width .25s}
#boot .ok{color:#7dffb2}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}
#trail{position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
.hero{position:relative}
.ring{position:absolute;left:50%;width:230px;height:230px;margin-left:-115px;pointer-events:none;z-index:-1;opacity:.8}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .r1{animation:rot 18s linear infinite}.ring .r2{animation:rot 11s linear infinite reverse}.ring .r3{animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hour .ic{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px);filter:drop-shadow(0 0 6px rgba(56,243,255,.6))}}
.range i{transform-origin:left;animation:fill 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.card.tilt{transition:transform .08s linear}
.card.untilt{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.caret::after{content:"▌";color:var(--neon);animation:flick .8s steps(1) infinite;margin-left:1px}
#sky,#fx{transition:transform .25s ease-out}
@media (prefers-reduced-motion:reduce){#boot{display:none}.ring svg,.hour .ic,.range i{animation:none!important}}
</style>
</head>
<body>
<div class="ptr" id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- WMO weercodes ---------- */
const WMO = {
  0:["Onbewolkt","☀️","🌙","clear"], 1:["Overwegend zonnig","🌤️","🌙","clear"],
  2:["Half bewolkt","⛅","☁️","cloud"], 3:["Bewolkt","☁️","☁️","cloud"],
  45:["Mist","🌫️","🌫️","fog"], 48:["Rijpmist","🌫️","🌫️","fog"],
  51:["Lichte motregen","🌦️","🌧️","rain"], 53:["Motregen","🌦️","🌧️","rain"], 55:["Dichte motregen","🌧️","🌧️","rain"],
  56:["Ijzel (motregen)","🌧️","🌧️","rain"], 57:["Ijzel","🌧️","🌧️","rain"],
  61:["Lichte regen","🌦️","🌧️","rain"], 63:["Regen","🌧️","🌧️","rain"], 65:["Zware regen","🌧️","🌧️","rain"],
  66:["Ijzel","🌧️","🌧️","rain"], 67:["Zware ijzel","🌧️","🌧️","rain"],
  71:["Lichte sneeuw","🌨️","🌨️","snow"], 73:["Sneeuw","🌨️","🌨️","snow"], 75:["Zware sneeuw","❄️","❄️","snow"], 77:["Sneeuwkorrels","🌨️","🌨️","snow"],
  80:["Lichte buien","🌦️","🌧️","rain"], 81:["Buien","🌧️","🌧️","rain"], 82:["Zware buien","⛈️","⛈️","rain"],
  85:["Sneeuwbuien","🌨️","🌨️","snow"], 86:["Zware sneeuwbuien","❄️","❄️","snow"],
  95:["Onweer","⛈️","⛈️","storm"], 96:["Onweer met hagel","⛈️","⛈️","storm"], 99:["Zwaar onweer met hagel","⛈️","⛈️","storm"]
};
const wmo = c => WMO[c] || ["Onbekend","🌡️","🌡️","cloud"];
const icon = (c, day) => { const w = wmo(c); return day === 0 ? w[2] : w[1]; };

const THEMES = {
  clear:[["#2a64a8","#5b97d2"],["#0b1834","#2c3f6e"]],
  cloud:[["#46576b","#687a8f"],["#1c2430","#3a4657"]],
  rain:[["#38475a","#566577"],["#111923","#2c3949"]],
  snow:[["#566c86","#7d8ea4"],["#24303f","#4a5a6e"]],
  fog:[["#575e68","#7a828c"],["#262b31","#474e57"]],
  storm:[["#2a2c40","#4b4f6b"],["#141522","#2e3048"]]
};
function setTheme(code, isDay){
  const kind = wmo(code)[3], t = THEMES[code === 2 ? "clear" : kind][isDay ? 0 : 1];
  const r = document.documentElement.style;
  r.setProperty("--bg1", t[0]); r.setProperty("--bg2", t[1]);
  window.__fx = [code === 2 ? "cloud" : kind, isDay, code]; if(window.FX) FX.set(...window.__fx);
  const cloudy = code >= 2 && kind !== "fog";
  r.setProperty("--cloud", !isDay ? "rgba(255,255,255,.10)" : kind === "cloud" && code === 2 ? "rgba(255,255,255,.85)" : "rgba(255,255,255,.22)");
  const C = '<svg viewBox="0 0 120 60"><path d="M30 55a22 22 0 0 1-2-44A28 28 0 0 1 80 12a20 20 0 0 1 12 43z"/></svg>';
  const spots = code === 2 ? [[-13,13,36],[78,9,32]] : [[-13,13,38],[78,9,34],[-8,30,26],[82,25,28]];
  $("sky").innerHTML = cloudy ? spots.map(([x,y,w]) => C.replace("<svg", `<svg style="left:${x}vw;top:${y}vh;width:${w}vw"`)).join("") : "";
  document.querySelector('meta[name="theme-color"]').content = "#060b16";
}

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const hm = iso => iso.slice(11,16);
const dateOf = iso => { const [y,m,d] = iso.slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
const dayName = (iso, i) => i === 0 ? "Vandaag" : dateOf(iso).toLocaleDateString("nl-NL",{weekday:"short"}).replace(".","").replace(/^./, s => s.toUpperCase());
const R = n => Math.round(n);
const DIRS = ["N","NNO","NO","ONO","O","OZO","ZO","ZZO","Z","ZZW","ZW","WZW","W","WNW","NW","NNW"];
const dirName = d => DIRS[Math.round(d / 22.5) % 16];
const bft = kmh => [1,6,12,20,29,39,50,62,75,89,103,118].findIndex(x => kmh < x) === -1 ? 12 : [1,6,12,20,29,39,50,62,75,89,103,118].findIndex(x => kmh < x);
const BFT_TXT = ["Windstil","Zwak","Zwak","Matig","Matig","Vrij krachtig","Krachtig","Hard","Stormachtig","Storm","Zware storm","Zeer zware storm","Orkaan"];
function uvTxt(u){ return u < 3 ? "Laag" : u < 6 ? "Matig" : u < 8 ? "Hoog" : u < 11 ? "Zeer hoog" : "Extreem"; }
function aqTxt(a){ return a <= 20 ? "Goed" : a <= 40 ? "Redelijk" : a <= 60 ? "Matig" : a <= 80 ? "Slecht" : a <= 100 ? "Zeer slecht" : "Extreem slecht"; }
async function getJSON(url, ms = 12000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try{ const r = await fetch(url, {signal:ctl.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function getText(url, ms = 6000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try{ const r = await fetch(url, {signal:ctl.signal}); if(!r.ok) throw new Error(r.status); return await r.text(); }
  finally{ clearTimeout(t); }
}

/* ---------- locatie ---------- */
let current = store.get("weer.active", null);   // {lat, lon, name, gps:true|false}
let saved = store.get("weer.saved", []);

function gps(){
  return new Promise((res, rej) => {
    if(!navigator.geolocation) return rej(new Error("Geen locatie beschikbaar"));
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lon:p.coords.longitude}),
      e => rej(e),
      {enableHighAccuracy:true, timeout:12000, maximumAge:5*60*1000}
    );
  });
}
async function placeName(lat, lon){
  try{
    const j = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=nl`, 6000);
    return j.city || j.locality || j.principalSubdivision || "Mijn locatie";
  }catch(e){ return "Mijn locatie"; }
}

/* ---------- data ophalen ---------- */
function forecastURL(lat, lon){
  const p = new URLSearchParams({
    latitude:lat.toFixed(4), longitude:lon.toFixed(4), timezone:"auto", forecast_days:"10",
    current:"temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,dew_point_2m",
    hourly:"temperature_2m,precipitation_probability,precipitation,weather_code,is_day,uv_index,visibility",
    daily:"weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant",
    minutely_15:"precipitation", forecast_minutely_15:"12"
  });
  return "https://api.open-meteo.com/v1/forecast?" + p;
}
async function buienradar(lat, lon){
  const t = await getText(`https://gpsgadget.buienradar.nl/data/raintext?lat=${lat.toFixed(2)}&lon=${lon.toFixed(2)}`);
  const rows = t.trim().split(/\r?\n/).map(l => l.split("|")).filter(a => a.length === 2);
  if(rows.length < 6) throw new Error("leeg");
  return rows.map(([v, time]) => ({ time:time.trim(), mm: Number(v) > 0 ? Math.pow(10, (Number(v) - 109) / 32) : 0 }));
}
async function airQuality(lat, lon){
  try{
    const j = await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi,pm2_5,grass_pollen,birch_pollen&timezone=auto`, 8000);
    return j.current;
  }catch(e){ return null; }
}

/* ---------- weerwaarschuwingen (MeteoAlarm / KNMI) ---------- */
function inPoly(lat, lon, poly){
  const pts = poly.trim().split(/\s+/).map(p => p.split(",").map(Number));
  let inside = false;
  for(let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const [yi, xi] = pts[i], [yj, xj] = pts[j];
    if(((yi > lat) !== (yj > lat)) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
async function warnings(lat, lon){
  if(!(lat > 50.6 && lat < 53.7 && lon > 3.2 && lon < 7.3)) return [];
  try{
    const j = await getJSON("https://feeds.meteoalarm.org/api/v1/warnings/feeds-netherlands", 9000);
    const now = Date.now(), out = [], seen = new Set();
    for(const w of j.warnings || []){
      const a = w.alert || {};
      if(a.msgType === "Cancel" || a.status !== "Actual") continue;
      const infos = a.info || [];
      const info = infos.find(i => /^nl/i.test(i.language)) || infos[0];
      if(!info || Date.parse(info.expires) < now) continue;
      const par = k => ((info.parameter || []).find(p => p.valueName === k) || {}).value || "";
      const level = parseInt(par("awareness_level")) || 1;
      if(level < 2) continue;
      if(!(info.area || []).some(ar => ar.polygon && [].concat(ar.polygon).some(pg => inPoly(lat, lon, pg)))) continue;
      const key = level + (par("awareness_type") || info.event) + info.onset;
      if(seen.has(key)) continue; seen.add(key);
      out.push({level, event:info.event, headline:info.headline || "", desc:info.description || "", onset:info.onset, expires:info.expires});
    }
    return out.sort((x, y) => y.level - x.level || Date.parse(x.onset) - Date.parse(y.onset));
  }catch(e){ return null; }
}
const fmtDT = iso => { const d = new Date(iso), t = new Date(); const same = d.toDateString() === t.toDateString();
  return (same ? "" : d.toLocaleDateString("nl-NL",{weekday:"short"}) + " ") + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function renderWarnings(list){
  const names = {2:"Code geel", 3:"Code oranje", 4:"Code rood"};
  $("warnings").innerHTML = (list || []).map(w => `<div class="warn l${w.level}" onclick="this.classList.toggle('open')"><div class="wt">⚠️ ${names[w.level]}: ${escapeHTML(w.event)}</div><div class="ws">${Date.parse(w.onset) > Date.now() ? "Van " + fmtDT(w.onset) + " " : ""}tot ${fmtDT(w.expires)} · tik voor details</div><div class="wd">${escapeHTML(w.headline)}${w.desc ? "<br>" + escapeHTML(w.desc) : ""}</div></div>`).join("");
}

let busy = false;
async function load(opts = {}){
  if(busy) return; busy = true;
  $("btnRefresh").classList.add("spin");
  try{
    if(!current || current.gps){
      try{
        const pos = await gps();
        const name = (current && current.gps && Math.abs(current.lat - pos.lat) < .01 && Math.abs(current.lon - pos.lon) < .01) ? current.name : await placeName(pos.lat, pos.lon);
        current = {lat:pos.lat, lon:pos.lon, name, gps:true};
        store.set("weer.active", current);
      }catch(e){
        if(!current){ showMsg("Ik kan je locatie niet bepalen. Sta locatietoegang toe voor deze app, of kies een plaats.", true); return; }
      }
    }
    const [fc, rain, aq, warn] = await Promise.all([
      getJSON(forecastURL(current.lat, current.lon)),
      buienradar(current.lat, current.lon).catch(() => null),
      airQuality(current.lat, current.lon),
      warnings(current.lat, current.lon)
    ]);
    const data = {fc, rain, aq, warn, place:current, at:Date.now()};
    store.set("weer.last", data);
    render(data);
  }catch(e){
    const last = store.get("weer.last", null);
    if(last){ render(last, true); }
    else showMsg("Geen verbinding met de weerdienst. Probeer het zo opnieuw.", true);
  }finally{
    busy = false; $("btnRefresh").classList.remove("spin");
  }
}
function showMsg(t, retry){
  $("main").classList.add("hidden");
  $("status").classList.remove("hidden");
  $("status").innerHTML = t + (retry ? '<br><button id="retry">Opnieuw proberen</button> <button id="pick">Plaats kiezen</button>' : "");
  if(retry){ $("retry").onclick = () => load(); $("pick").onclick = openSheet; }
}

/* ---------- render ---------- */
function render(d, stale){
  const {fc, place} = d, c = fc.current, h = fc.hourly, dy = fc.daily;
  $("status").classList.add("hidden"); $("main").classList.remove("hidden");
  setTheme(c.weather_code, c.is_day);

  const loc = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3L3 10.5l7.5 3L13.5 21z"/></svg>';
  $("place").innerHTML = (place.gps ? loc : "") + escapeHTML(place.name);
  $("temp").textContent = R(c.temperature_2m) + "°";
  window.__wind = [c.wind_speed_10m || 0, c.wind_direction_10m || 0];
  $("cond").textContent = wmo(c.weather_code)[0];
  $("hilo").textContent = `H:${R(dy.temperature_2m_max[0])}°  L:${R(dy.temperature_2m_min[0])}°`;
  const t = new Date(d.at);
  $("updated").textContent = (stale ? "Offline · laatst bijgewerkt " : "Bijgewerkt ") + pad(t.getHours()) + ":" + pad(t.getMinutes());

  // index van huidig uur
  const nowHour = c.time.slice(0,13);
  let hi = h.time.findIndex(x => x.slice(0,13) === nowHour); if(hi < 0) hi = 0;

  renderWarnings(d.warn);
  renderRain(d, c);
  renderHours(h, dy, hi, c);
  renderDays(dy, c, h, hi);
  renderTiles(c, h, dy, hi, d.aq);
  initRadar(place.lat, place.lon);
}
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function renderRain(d, c){
  let pts, src, step;
  if(d.rain && d.rain.length){
    pts = d.rain.slice(0, 24); src = "Buienradar · per 5 minuten"; step = 5;
  }else{
    const m = d.fc.minutely_15 || {time:[], precipitation:[]};
    pts = m.time.map((t,i) => ({time:hm(t), mm:(m.precipitation[i] || 0) * 4})); src = "Open-Meteo · per kwartier"; step = 15;
  }
  if(!pts.length){ $("rainCard").classList.add("hidden"); return; }
  $("rainCard").classList.remove("hidden");
  const n = pts.length, pos = i => (i / n * 100).toFixed(2) + "%";
  const max = Math.max(2, ...pts.map(p => p.mm));
  // tijdas: elk half uur een label + verticale hulplijn
  const every = Math.max(1, Math.round(30 / step));
  let ticks = "", axis = `<span class="first" style="left:0">Nu</span>`;
  for(let i = every; i < n; i += every){
    ticks += `<div style="left:${pos(i)}"></div>`;
    if(i <= n - every / 2) axis += `<span style="left:${pos(i)}">${pts[i].time}</span>`;
  }
  $("rainChart").innerHTML =
    '<div class="rainlines"><div style="top:0">' + (max > 5 ? "zwaar" : "matig") + '</div><div style="top:50%">licht</div></div>' +
    '<div class="rainticks">' + ticks + '</div>' +
    pts.map((p,i) => `<div class="bar${p.mm < .05 ? " zero" : ""}" data-i="${i}" style="height:${p.mm < .05 ? 2 : Math.max(6, Math.min(100, Math.sqrt(p.mm / max) * 100))}%"></div>`).join("");
  $("rainAxis").innerHTML = axis;
  $("rainSrc").textContent = src;

  // regenperiodes: van wanneer tot wanneer
  const wet = pts.map(p => p.mm >= .1), spans = [];
  for(let i = 0; i < n; i++) if(wet[i] && (i === 0 || !wet[i-1])){
    let e = i; while(e + 1 < n && wet[e+1]) e++;
    spans.push({s:i, e, from: i === 0 ? "nu" : pts[i].time, to: e + 1 < n ? pts[e+1].time : null, peak: Math.max(...pts.slice(i, e+1).map(p => p.mm))});
    i = e;
  }
  const label = sp => sp.to ? `${sp.from}–${sp.to}` : `${sp.from}–…`;
  $("rainSpans").innerHTML = spans.map(sp =>
    `<div style="left:${pos(sp.s)};width:calc(${pos(sp.e + 1)} - ${pos(sp.s)})"><span>${(sp.e - sp.s + 1) * step >= 20 ? label(sp) : ""}</span></div>`).join("");
  $("rainSpans").style.display = spans.length ? "" : "none";

  const kind = mm => mm >= 2.5 ? "flinke regen" : mm < .5 ? "lichte regen" : "regen";
  let s;
  if(!spans.length) s = "Droog de komende 2 uur.";
  else{
    s = spans.map((sp, k) => {
      const k1 = k === 0 ? kind(sp.peak).replace(/^./, x => x.toUpperCase()) : kind(sp.peak);
      if(sp.s === 0) return sp.to ? `${k1} tot ${sp.to}` : `${k1} de komende 2 uur`;
      return sp.to ? `${k1} van ${sp.from} tot ${sp.to}` : `${k1} vanaf ${sp.from}`;
    }).join(", daarna ");
    s += spans[spans.length - 1].to ? ", daarna droog." : ".";
  }
  $("rainSummary").textContent = s;

  // aantikken/slepen: tijd en hoeveelheid van een balk tonen
  const chart = $("rainChart"), pick = $("rainPick");
  pick.textContent = "Tik op de grafiek voor tijd en hoeveelheid";
  const show = ev => {
    const r = chart.getBoundingClientRect(), x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(n - 1, Math.floor(x / r.width * n)));
    chart.querySelectorAll(".bar.sel").forEach(b => b.classList.remove("sel"));
    chart.querySelector(`.bar[data-i="${i}"]`).classList.add("sel");
    const p = pts[i], end = i + 1 < n ? pts[i+1].time : "";
    pick.textContent = `${i === 0 ? "Nu" : p.time}${end ? "–" + end : ""} · ` + (p.mm < .05 ? "droog" : `${p.mm.toFixed(1).replace(".", ",")} mm/u (${kind(p.mm)})`);
  };
  chart.onpointerdown = chart.onpointermove = e => { if(e.pointerType !== "mouse" || e.buttons || e.type === "pointerdown") show(e); };
  chart.style.touchAction = "pan-y";
}

function renderHours(h, dy, hi, c){
  // samenvatting van de dag
  const rainH = [];
  for(let i = hi; i < hi + 12 && i < h.time.length; i++) if(h.precipitation_probability[i] >= 50) rainH.push(i);
  const gust = R(c.wind_gusts_10m);
  let s = `${wmo(c.weather_code)[0]}. `;
  s += rainH.length ? `Kans op regen rond ${hm(h.time[rainH[0]])}. ` : "Komende 12 uur waarschijnlijk droog. ";
  s += `Wind ${dirName(c.wind_direction_10m)} ${bft(c.wind_speed_10m)} Bft` + (gust >= 50 ? `, windstoten tot ${gust} km/u.` : ".");
  $("daySummary").textContent = s;

  const suns = [];
  for(let i = 0; i < 2; i++){ suns.push({t:dy.sunrise[i], k:"Zon op", ic:"🌅"}); suns.push({t:dy.sunset[i], k:"Zon onder", ic:"🌇"}); }
  let html = "";
  for(let i = hi; i < hi + 25 && i < h.time.length; i++){
    const p = h.precipitation_probability[i];
    html += `<div class="hour"><div class="t">${i === hi ? "Nu" : h.time[i].slice(11,13)}</div><div class="p">${p >= 20 ? R(p/10)*10 + "%" : ""}</div><div class="ic">${icon(h.weather_code[i], h.is_day[i])}</div><div class="mm">${h.precipitation[i] >= 0.1 ? h.precipitation[i].toFixed(1).replace(".", ",") + " mm" : ""}</div><div class="v">${R(i === hi ? c.temperature_2m : h.temperature_2m[i])}°</div></div>`;
    const sn = suns.find(x => x.t && x.t.slice(0,13) === h.time[i].slice(0,13) && (i > hi || x.t > c.time));
    if(sn) html += `<div class="hour sun"><div class="t">${hm(sn.t)}</div><div class="p"></div><div class="ic">${sn.ic}</div><div class="mm"></div><div class="v">${sn.k}</div></div>`;
  }
  $("hours").innerHTML = html;
  $("hours").scrollLeft = 0;
}

function renderDays(dy, c){
  const lo = Math.min(...dy.temperature_2m_min), hiT = Math.max(...dy.temperature_2m_max), span = Math.max(1, hiT - lo);
  $("days").innerHTML = dy.time.map((t, i) => {
    const a = (dy.temperature_2m_min[i] - lo) / span * 100, b = (dy.temperature_2m_max[i] - lo) / span * 100;
    const p = dy.precipitation_probability_max[i];
    const dot = i === 0 ? `<b style="left:${Math.min(100, Math.max(0, (c.temperature_2m - lo) / span * 100))}%"></b>` : "";
    const detail = `${wmo(dy.weather_code[i])[0]} · ${(dy.precipitation_sum[i] || 0).toFixed(1)} mm · wind ${dirName(dy.wind_direction_10m_dominant[i])} ${bft(dy.wind_speed_10m_max[i])} Bft · UV ${R(dy.uv_index_max[i] || 0)} · zon ${hm(dy.sunrise[i])}–${hm(dy.sunset[i])}`;
    return `<div class="day" onclick="this.classList.toggle('open')"><div class="d">${dayName(t, i)}</div><div class="ic">${icon(dy.weather_code[i], 1)}</div><div class="p">${p >= 20 ? R(p/10)*10 + "%" : ""}</div><div class="lo">${R(dy.temperature_2m_min[i])}°</div><div class="range"><i style="left:${a}%;width:${Math.max(4, b - a)}%"></i>${dot}</div><div class="hi">${R(dy.temperature_2m_max[i])}°</div><div class="daydetail">${detail}</div></div>`;
  }).join("");
}

function tile(title, svgPath, body){
  return `<section class="card"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svgPath}</svg>${title}</h2>${body}</section>`;
}
function renderTiles(c, h, dy, hi, aq){
  const uv = h.uv_index[hi] || 0, vis = h.visibility[hi];
  const feels = R(c.apparent_temperature), tmp = R(c.temperature_2m);
  const nextRain = (() => { for(let i = 1; i < dy.time.length; i++) if((dy.precipitation_sum[i] || 0) >= 1) return i; return -1; })();
  const sunUp = c.time < dy.sunrise[0] ? dy.sunrise[0] : c.time < dy.sunset[0] ? null : dy.sunrise[1];
  const mins = iso => +iso.slice(11,13) * 60 + +iso.slice(14,16);
  const dlen = mins(dy.sunset[0]) - mins(dy.sunrise[0]);
  const rot = (c.wind_direction_10m + 180) % 360;

  let t = "";
  t += tile("Voelt als", '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>',
    `<div class="big">${feels}°</div><div class="note">${feels < tmp - 1 ? (c.wind_speed_10m >= 10 ? "Voelt kouder door de wind." : "Voelt kouder door de droge lucht.") : feels > tmp + 1 ? (c.is_day && c.cloud_cover < 60 ? "Voelt warmer door zon en weinig wind." : "Voelt warmer door de vochtige lucht.") : "Voelt zoals de echte temperatuur."}</div>`);
  t += tile("Wind", '<path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h9"/>',
    `<div class="compass"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
      ${[0,90,180,270].map((a,i)=>`<text x="${50+38*Math.sin(a*Math.PI/180)}" y="${53-38*Math.cos(a*Math.PI/180)}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.7)" font-weight="600">${"NOZW"[i]}</text>`).join("")}
      <g transform="rotate(${rot} 50 50)"><path d="M50 12 L55 24 L50 21 L45 24 Z" fill="#fff"/><line x1="50" y1="22" x2="50" y2="82" stroke="#fff" stroke-width="2"/><circle cx="50" cy="84" r="3" fill="none" stroke="#fff" stroke-width="2"/></g>
      <circle cx="50" cy="50" r="22" fill="#2a3442"/></svg>
      <div class="c"><b>${bft(c.wind_speed_10m)}</b><span>Bft</span></div></div>
     <div class="note">${dirName(c.wind_direction_10m)} · ${R(c.wind_speed_10m)} km/u<br>Stoten ${R(c.wind_gusts_10m)} km/u</div>`);
  t += tile("Neerslag", '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
    `<div class="big">${(dy.precipitation_sum[0] || 0).toFixed(1)} mm</div><div class="sub">vandaag</div><div class="note">${nextRain < 0 ? "Daarna geen noemenswaardige regen in de komende 10 dagen." : nextRain === 1 ? `Morgen ${dy.precipitation_sum[1].toFixed(1)} mm verwacht.` : `Volgende regen: ${dayName(dy.time[nextRain], nextRain).toLowerCase()} (${dy.precipitation_sum[nextRain].toFixed(1)} mm).`}</div>`);
  t += tile("UV-index", '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    `<div class="big">${R(uv)}</div><div class="sub">${uvTxt(uv)}</div><div class="meter uvm"><b style="left:${Math.min(100, uv / 11 * 100)}%"></b></div><div class="note">Vandaag max ${R(dy.uv_index_max[0] || 0)}.</div>`);
  t += tile(sunUp ? "Zonsopkomst" : "Zonsondergang", '<path d="M17 18a5 5 0 0 0-10 0M12 2v7M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M8 6l4-4 4 4"/>',
    `<div class="big">${hm(sunUp || dy.sunset[0])}</div><div class="note">${sunUp ? "Zonsondergang " + hm(dy.sunset[0] > c.time ? dy.sunset[0] : dy.sunset[1]) : "Zonsopkomst morgen " + hm(dy.sunrise[1])}<br>Daglicht ${Math.floor(dlen/60)}u ${pad(R(dlen%60))}m</div>`);
  t += tile("Vochtigheid", '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9 15h6"/>',
    `<div class="big">${R(c.relative_humidity_2m)}%</div><div class="note">Dauwpunt is nu ${R(c.dew_point_2m)}°.</div>`);
  t += tile("Zicht", '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
    `<div class="big">${vis == null ? "–" : vis >= 10000 ? R(vis/1000) + " km" : (vis/1000).toFixed(1) + " km"}</div><div class="note">${vis == null ? "" : vis < 1000 ? "Mist. Let op in het verkeer." : vis < 5000 ? "Heiig of nevelig." : "Goed zicht."}</div>`);
  t += tile("Luchtdruk", '<circle cx="12" cy="12" r="9"/><path d="M12 12l4-4"/>',
    `<div class="big">${R(c.pressure_msl)}</div><div class="sub">hPa</div><div class="note">${c.pressure_msl < 1000 ? "Lage druk: wisselvallig." : c.pressure_msl > 1020 ? "Hoge druk: stabiel weer." : "Normale luchtdruk."}</div>`);
  if(aq && aq.european_aqi != null){
    const pol = Math.max(aq.grass_pollen || 0, aq.birch_pollen || 0);
    t += tile("Luchtkwaliteit", '<path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3"/>',
      `<div class="big">${R(aq.european_aqi)}</div><div class="sub">${aqTxt(aq.european_aqi)}</div><div class="meter aqm"><b style="left:${Math.min(100, aq.european_aqi)}%"></b></div><div class="note">Fijnstof ${R(aq.pm2_5 || 0)} µg/m³${pol >= 10 ? " · pollen " + (pol >= 50 ? "veel" : "matig") : ""}</div>`);
    t += tile("Bewolking", '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>',
      `<div class="big">${R(c.cloud_cover)}%</div><div class="note">${c.cloud_cover < 20 ? "Vrijwel onbewolkt." : c.cloud_cover < 70 ? "Wisselend bewolkt." : "Grotendeels bewolkt."}</div>`);
  }
  $("tiles").innerHTML = t;
}

/* ---------- radar ---------- */
let map, me, frames = [], layers = {}, fi = 0, timer = null, radarSrc = "";
const PLAY = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
const BR = "https://image.buienradar.nl/2.0/metadata/sprite/RadarMapRainWebMercatorNL?width=1058&height=915&history=12&forecast=24&skip=0";
const BR_BOUNDS = [[54.8, 0], [49.5, 10]];
const inNL = (lat, lon) => lat > 49.8 && lat < 54.5 && lon > 0.5 && lon < 9.5;
async function initRadar(lat, lon){
  if(typeof L === "undefined") { $("radarWrap").parentElement.classList.add("hidden"); return; }
  const nl = inNL(lat, lon);
  if(!map){
    map = L.map("map", {zoomControl:false, attributionControl:true, scrollWheelZoom:false}).setView([lat, lon], nl ? 9 : 7);
    L.tileLayer(ESRI + "World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {attribution:"Esri", maxZoom:13}).addTo(map);
    map.createPane("labels"); map.getPane("labels").style.zIndex = 450; map.getPane("labels").style.pointerEvents = "none";
    L.tileLayer(ESRI + "World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {pane:"labels", maxZoom:13}).addTo(map);
    me = L.marker([lat, lon], {icon:L.divIcon({className:"", html:'<div class="me"></div>', iconSize:[14,14], iconAnchor:[7,7]}), pane:"labels"}).addTo(map);
    $("radarPlay").innerHTML = PLAY;
    $("radarPlay").onclick = () => { if(timer){ stop(); userStopped = true; } else { userStopped = false; play(); } };
    $("radarSlider").oninput = e => { stop(); userStopped = true; show(+e.target.value); };
    $("radarFs").onclick = () => { $("radarWrap").classList.toggle("full"); setTimeout(() => map.invalidateSize(), 50); };
  }else{
    map.setView([lat, lon], map.getZoom()); me.setLatLng([lat, lon]);
  }
  try{
    let fresh, now = 0;
    if(nl){
      const j = await getJSON(BR, 8000);
      const nowT = Date.parse(j.stilltimestamp + "Z");
      fresh = (j.times || []).filter((t, i) => i % 2 === 0 || Date.parse(t.timestamp + "Z") === nowT)
        .map(t => ({time:Date.parse(t.timestamp + "Z") / 1000, url:t.url, fc:Date.parse(t.timestamp + "Z") > nowT}));
      now = fresh.findIndex(f => f.time * 1000 === nowT); if(now < 0) now = fresh.filter(f => !f.fc).length - 1;
    }else{
      const j = await getJSON("https://api.rainviewer.com/public/weather-maps.json", 8000);
      fresh = (j.radar.past || []).map(f => ({time:f.time, url:`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`, tiles:true}));
      now = fresh.length - 1;
    }
    if(!fresh.length) return;
    stop(); Object.values(layers).forEach(l => map.removeLayer(l)); layers = {};
    frames = fresh; radarSrc = nl ? "Buienradar" : "RainViewer";
    $("radarSlider").max = frames.length - 1;
    show(now);
    if(radarVisible && !userStopped) play();
  }catch(e){}
}
function layer(i){
  if(!layers[i]){
    const f = frames[i];
    layers[i] = f.tiles
      ? L.tileLayer(f.url, {opacity:0, maxNativeZoom:7, maxZoom:13, attribution:"RainViewer"}).addTo(map)
      : L.imageOverlay(f.url, BR_BOUNDS, {opacity:0, attribution:"Buienradar", className:"brimg"}).addTo(map);
  }
  return layers[i];
}
function show(i){
  if(!frames.length) return;
  if(layers[fi]) layers[fi].setOpacity(0);
  fi = i; layer(fi).setOpacity(.9);
  $("radarSlider").value = fi;
  const d = new Date(frames[fi].time * 1000);
  $("radarTime").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  $("radarSrc").textContent = frames[fi].fc ? "verwachting" : radarSrc;
  $("radarSrc").style.color = frames[fi].fc ? "#ffd25e" : "";
}
function play(){
  frames.forEach((f, i) => layer(i));
  $("radarPlay").innerHTML = PAUSE;
  timer = setInterval(() => show((fi + 1) % frames.length), 450);
}
function stop(){ $("radarPlay").innerHTML = PLAY; clearInterval(timer); timer = null; }
let radarVisible = false, userStopped = false;
if("IntersectionObserver" in window){
  new IntersectionObserver(es => es.forEach(e => {
    radarVisible = e.isIntersecting;
    if(radarVisible && !userStopped && !timer && frames.length) play();
    else if(!radarVisible && timer){ stop(); userStopped = false; }
  }), {threshold:.6}).observe($("radarWrap"));
}

/* ---------- plaatsen ---------- */
function openSheet(){ $("sheet").classList.add("open"); $("search").value = ""; $("results").innerHTML = ""; renderSaved(); }
function closeSheet(){ $("sheet").classList.remove("open"); }
const PIN = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3L3 10.5l7.5 3L13.5 21z"/></svg>';
function renderSaved(){
  let html = `<button class="pitem" data-gps="1">${PIN}<span class="n"><div>Mijn locatie</div><small>Live via gps</small></span></button>`;
  html += saved.map((p, i) => `<div class="pitem" data-i="${i}"><span class="n"><div>${escapeHTML(p.name)}</div><small>${escapeHTML(p.region || "")}</small></span><button class="x" data-del="${i}" aria-label="Verwijderen">✕</button></div>`).join("");
  $("saved").innerHTML = html;
}
$("saved").onclick = e => {
  const del = e.target.closest("[data-del]");
  if(del){ e.stopPropagation(); saved.splice(+del.dataset.del, 1); store.set("weer.saved", saved); renderSaved(); return; }
  const it = e.target.closest(".pitem"); if(!it) return;
  if(it.dataset.gps) current = null;
  else { const p = saved[+it.dataset.i]; current = {lat:p.lat, lon:p.lon, name:p.name, gps:false}; }
  store.set("weer.active", current); closeSheet(); load();
};
let st;
$("search").oninput = e => {
  clearTimeout(st); const q = e.target.value.trim();
  if(q.length < 2){ $("results").innerHTML = ""; return; }
  st = setTimeout(async () => {
    try{
      const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=nl`);
      const res = j.results || [];
      $("results").innerHTML = res.length ? res.map((r, i) => `<button class="pitem" data-r="${i}"><span class="n"><div>${escapeHTML(r.name)}</div><small>${escapeHTML([r.admin1, r.country].filter(Boolean).join(", "))}</small></span><span>＋</span></button>`).join("") : '<div class="pitem"><span class="n"><small>Niets gevonden</small></span></div>';
      $("results").onclick = ev => {
        const b = ev.target.closest("[data-r]"); if(!b) return;
        const r = res[+b.dataset.r];
        const p = {name:r.name, region:[r.admin1, r.country].filter(Boolean).join(", "), lat:r.latitude, lon:r.longitude};
        if(!saved.some(s => Math.abs(s.lat - p.lat) < .01 && Math.abs(s.lon - p.lon) < .01)){ saved.push(p); store.set("weer.saved", saved); }
        current = {lat:p.lat, lon:p.lon, name:p.name, gps:false};
        store.set("weer.active", current); closeSheet(); load();
      };
    }catch(err){ $("results").innerHTML = '<div class="pitem"><span class="n"><small>Zoeken lukt nu niet</small></span></div>'; }
  }, 300);
};
$("btnPlaces").onclick = openSheet;
$("btnClose").onclick = closeSheet;
$("sheet").onclick = e => { if(e.target.id === "sheet") closeSheet(); };
$("btnRefresh").onclick = () => load();
(() => {
  let y0 = null, dy = 0; const ptr = $("ptr");
  const set = (d, o) => { ptr.style.transform = `translateY(${d - 60}px) rotate(${d * 3}deg)`; ptr.style.opacity = o; };
  addEventListener("touchstart", e => { y0 = (scrollY <= 0 && !$("sheet").classList.contains("open") && !e.target.closest("#radarWrap, .hours")) ? e.touches[0].clientY : null; dy = 0; }, {passive:true});
  addEventListener("touchmove", e => { if(y0 === null) return; dy = Math.max(0, Math.min(110, (e.touches[0].clientY - y0) * .5)); ptr.style.transition = "none"; set(dy, Math.min(1, dy / 60)); }, {passive:true});
  addEventListener("touchend", async () => {
    if(y0 === null) return; y0 = null; ptr.style.transition = "transform .25s, opacity .25s";
    if(dy >= 60){ set(60, 1); ptr.classList.add("spin"); await load(); ptr.classList.remove("spin"); }
    set(0, 0);
  });
})();

/* ---------- start ---------- */
const last = store.get("weer.last", null);
if(last && current && last.place && last.place.lat === current.lat) render(last, true);
load();
let lastLoad = Date.now();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && Date.now() - lastLoad > 5 * 60 * 1000){ lastLoad = Date.now(); load(); }
});
setInterval(() => { if(document.visibilityState === "visible"){ lastLoad = Date.now(); load(); } }, 10 * 60 * 1000);

if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>

<script>
/* ================= EFFECTEN ================= */
(function(){
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d"), flash = document.getElementById("flash");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, DPR, parts = [], mode = "clear", day = true, heavy = false, last = 0, bolt = null, nextBolt = 0, shoot = null;
  function size(){ DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener("resize", size); size();
  const rnd = (a,b) => a + Math.random()*(b-a);
  const windX = () => { const w = window.__wind; if(!w) return .15; return -Math.sin(w[1]*Math.PI/180) * Math.min(.9, .08 + w[0]/45); };
  function make(){
    parts = [];
    const n = mode === "rain" || mode === "storm" ? (heavy ? 260 : 150) : mode === "snow" ? 120 : mode === "fog" ? 14 : !day && (mode === "clear") ? 140 : 50;
    for(let i = 0; i < n; i++) parts.push(spawn(true));
  }
  function spawn(init){
    const p = {x:rnd(0,W), y:init ? rnd(0,H) : -20, z:rnd(.3,1)};
    if(mode === "rain" || mode === "storm"){ p.v = rnd(12,20)*p.z; p.l = rnd(10,22)*p.z; }
    else if(mode === "snow"){ p.v = rnd(.4,1.3)*p.z; p.r = rnd(1,3.2)*p.z; p.ph = rnd(0,6.3); }
    else if(mode === "fog"){ p.r = rnd(120,260); p.v = rnd(.1,.35); p.y = rnd(0,H); p.x = init ? rnd(-200,W) : -260; }
    else if(!day && mode === "clear"){ p.y = rnd(0,H*.7); p.r = rnd(.4,1.6); p.ph = rnd(0,6.3); p.sp = rnd(.5,2); }
    else { p.v = rnd(.15,.5)*p.z; p.r = rnd(.8,2.4)*p.z; p.ph = rnd(0,6.3); if(!init) p.y = H+10; }
    return p;
  }
  function drawBolt(){
    const pts = [[rnd(W*.2,W*.8),0]];
    while(pts[pts.length-1][1] < H*rnd(.45,.7)){ const [x,y] = pts[pts.length-1]; pts.push([x+rnd(-40,40), y+rnd(20,50)]); }
    return {pts, t:0};
  }
  function frame(ts){
    const dt = Math.min(3, (ts - last)/16.7 || 1); last = ts;
    ctx.clearRect(0,0,W,H);
    if(mode === "rain" || mode === "storm"){
      ctx.lineCap = "round";
      for(const p of parts){
        ctx.strokeStyle = `rgba(120,240,255,${.25+.45*p.z})`; ctx.lineWidth = p.z*1.3;
        const sl = windX(); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.l*sl, p.y - p.l); ctx.stroke();
        p.y += p.v*dt; p.x += p.v*sl*dt;
        if(p.y > H){ if(p.z > .75){ ctx.strokeStyle = "rgba(120,240,255,.5)"; ctx.beginPath(); ctx.ellipse(p.x, H-4, 6*p.z, 1.5, 0, 0, 6.3); ctx.stroke(); } Object.assign(p, spawn(false)); p.x = rnd(-80,W+80); if(p.x < 0 && windX() < 0) p.x += W; if(p.x > W && windX() > 0) p.x -= W; }
      }
      if(mode === "storm"){
        if(ts > nextBolt){ bolt = drawBolt(); nextBolt = ts + rnd(4000,11000); flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
          setTimeout(() => { document.body.classList.add("shake"); navigator.vibrate && navigator.vibrate([30,40,60]); setTimeout(() => document.body.classList.remove("shake"), 600); }, rnd(300,1200)); }
        if(bolt){ bolt.t += dt; const a = Math.max(0, 1 - bolt.t/18);
          ctx.strokeStyle = `rgba(220,240,255,${a})`; ctx.lineWidth = 2.5; ctx.shadowColor = "#9fd8ff"; ctx.shadowBlur = 20;
          ctx.beginPath(); bolt.pts.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke(); ctx.shadowBlur = 0;
          if(a <= 0) bolt = null; }
      }
    }else if(mode === "snow"){
      for(const p of parts){
        p.ph += .02*dt; p.y += p.v*dt; p.x += (Math.sin(p.ph)*.5 + windX()*2)*dt; if(p.x > W+10) p.x = -10; if(p.x < -10) p.x = W+10;
        const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3); g.addColorStop(0,"rgba(230,250,255,.95)"); g.addColorStop(1,"rgba(56,243,255,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3,0,6.3); ctx.fill();
        if(p.y > H+10) Object.assign(p, spawn(false));
      }
    }else if(mode === "fog"){
      for(const p of parts){
        p.x += p.v*dt; const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); g.addColorStop(0,"rgba(160,220,240,.10)"); g.addColorStop(1,"rgba(160,220,240,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.3); ctx.fill();
        if(p.x - p.r > W) Object.assign(p, spawn(false));
      }
    }else if(!day && mode === "clear"){
      for(let b = 0; b < 3; b++){
        const y0 = H*(.12 + b*.07), g = ctx.createLinearGradient(0, y0-60, 0, y0+90);
        g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.5, b === 1 ? "rgba(178,107,255,.13)" : "rgba(60,255,180,.12)"); g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, H*.5);
        for(let x = 0; x <= W; x += 12) ctx.lineTo(x, y0 + Math.sin(x/90 + ts/2200 + b*2)*26 + Math.sin(x/37 + ts/1300)*8);
        ctx.lineTo(W, y0 + 140); ctx.lineTo(0, y0 + 140); ctx.fill();
      }
      for(const p of parts){ p.ph += .03*p.sp*dt; ctx.fillStyle = `rgba(210,245,255,${.25+.6*Math.abs(Math.sin(p.ph))})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.3); ctx.fill(); }
      if(!shoot && Math.random() < .002*dt) shoot = {x:rnd(W*.3,W), y:rnd(0,H*.3), t:0};
      if(shoot){ shoot.t += dt; const L = 90, x = shoot.x - shoot.t*9, y = shoot.y + shoot.t*4, a = Math.max(0,1-shoot.t/40);
        const g = ctx.createLinearGradient(x,y,x+L,y-L*.45); g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(1,"rgba(56,243,255,0)");
        ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+L,y-L*.45); ctx.stroke(); if(a <= 0) shoot = null; }
    }else{
      if(mode === "clear" && day){ const g = ctx.createRadialGradient(W*.85,H*.06,0,W*.85,H*.06,W*.7); g.addColorStop(0,"rgba(255,230,160,.22)"); g.addColorStop(.3,"rgba(56,243,255,.06)"); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(0,0,W,H); }
      for(const p of parts){
        p.ph += .02*dt; p.y -= p.v*dt; p.x += Math.sin(p.ph)*.3*dt;
        ctx.fillStyle = `rgba(56,243,255,${.25+.35*Math.abs(Math.sin(p.ph))})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.3); ctx.fill();
        if(p.y < -10) Object.assign(p, spawn(false));
      }
    }
    if(!document.hidden) requestAnimationFrame(frame); else running = false;
  }
  let running = false;
  function start(){ if(!running && !reduce){ running = true; requestAnimationFrame(frame); } }
  document.addEventListener("visibilitychange", () => { if(!document.hidden) start(); });
  window.FX = {set(k, isDay, code){ const nk = k + isDay; if(nk === mode + day && parts.length) return; mode = k; day = !!isDay; heavy = [65,67,82,95,96,99].includes(code); nextBolt = performance.now() + 2500; make(); start(); }};
  if(window.__fx) FX.set(...window.__fx);

  /* kaarten laten invliegen + glans */
  const seen = new WeakSet();
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("fxin"); io.unobserve(e.target); } }), {threshold:.08});
  function decorate(){
    document.querySelectorAll(".card,.warn").forEach((c,i) => {
      if(seen.has(c)) return; seen.add(c);
      if(c.classList.contains("card") && !c.querySelector(".shine")){ const sh = document.createElement("div"); sh.className = "shine"; sh.style.animationDelay = (i*1.3 % 9) + "s"; c.appendChild(sh); }
      c.style.animationDelay = Math.min(i, 6)*70 + "ms"; io.observe(c);
    });
  }
  new MutationObserver(decorate).observe(document.body, {childList:true, subtree:true}); decorate();

  /* temperatuur optellen + af en toe glitch */
  const tEl = document.getElementById("temp"); let shown = null, mine = null, anim = 0;
  new MutationObserver(() => {
    if(tEl.textContent === mine) return; const m = tEl.textContent.match(/^(-?\d+)°$/); if(!m) return; const to = +m[1];
    if(shown === to || reduce){ shown = to; return; }
    const from = shown === null ? Math.round(to - 12) : shown, t0 = performance.now(), id = ++anim; shown = to;
    const step = now => { if(id !== anim) return; const k = Math.min(1,(now-t0)/1100), e = 1-Math.pow(1-k,3); mine = Math.round(from + (to-from)*e) + "°"; tEl.textContent = mine; if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }).observe(tEl, {childList:true, characterData:true, subtree:true});
  setInterval(() => { if(document.hidden || reduce) return; tEl.classList.add("glitch"); setTimeout(() => tEl.classList.remove("glitch"), 500); }, 9000);

  /* neon-ripple bij aantikken */
  document.addEventListener("pointerdown", e => {
    const host = e.target.closest(".card,.iconbtn,.pitem,.warn"); if(!host || e.target.closest("#map,.rainchart")) return;
    const r = host.getBoundingClientRect(), d = document.createElement("span");
    if(getComputedStyle(host).position === "static") host.style.position = "relative";
    d.className = "ripple"; d.style.left = (e.clientX - r.left) + "px"; d.style.top = (e.clientY - r.top) + "px";
    host.appendChild(d); setTimeout(() => d.remove(), 650); navigator.vibrate && navigator.vibrate(8);
  }, {passive:true});

  /* parallax van de kop bij scrollen */
  const hero = document.querySelector(".hero");
  if(hero && !reduce) addEventListener("scroll", () => { const y = Math.min(scrollY, 300); hero.style.transform = `translateY(${y*.35}px)`; hero.style.opacity = 1 - y/320; }, {passive:true});
})();
</script>

<script>
/* ================= EFFECTEN 2 ================= */
(function(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, $ = id => document.getElementById(id);
  const rnd = (a,b) => a + Math.random()*(b-a);

  /* 1. opstartscherm (1x per sessie) */
  let booted = false; try{ booted = sessionStorage.getItem("boot") === "1"; sessionStorage.setItem("boot","1"); }catch(e){}
  if(!booted && !reduce){
    const b = document.createElement("div"); b.id = "boot";
    b.innerHTML = '<div class="logo">WEER//OS</div><div id="bl"></div><div class="bar"><i id="bb"></i></div>';
    document.body.appendChild(b);
    const lines = ["VERBINDING SATELLIET","LOCATIE TRIANGULEREN","ATMOSFEER SCANNEN","NEERSLAGRADAR SYNCEN","HOLOGRAM LADEN"];
    let i = 0;
    const next = () => {
      if(i < lines.length){ $("bl").insertAdjacentHTML("beforeend", `<div>&gt; ${lines[i]}… <span class="ok">OK</span></div>`); $("bb").style.width = ((i+1)/lines.length*100) + "%"; i++; setTimeout(next, rnd(180,320)); }
      else setTimeout(() => { b.classList.add("out"); setTimeout(() => b.remove(), 500); }, 250);
    };
    setTimeout(next, 250);
    b.addEventListener("pointerdown", () => { b.classList.add("out"); setTimeout(() => b.remove(), 500); });
  }

  /* 2. HUD-ring om de temperatuur */
  const hero = document.querySelector(".hero"), temp = $("temp");
  const ring = document.createElement("div"); ring.className = "ring";
  let ticks = ""; for(let a = 0; a < 360; a += 6) ticks += `<line x1="115" y1="${a % 30 ? 6 : 0}" x2="115" y2="12" transform="rotate(${a} 115 115)"/>`;
  ring.innerHTML = `<svg viewBox="0 0 230 230"><g class="r3" style="transform-origin:115px 115px" stroke="rgba(56,243,255,.35)" stroke-width="1">${ticks}</g>
    <circle class="r1" style="transform-origin:115px 115px" cx="115" cy="115" r="96" fill="none" stroke="rgba(56,243,255,.55)" stroke-width="1.5" stroke-dasharray="60 14 6 14"/>
    <circle class="r2" style="transform-origin:115px 115px" cx="115" cy="115" r="84" fill="none" stroke="rgba(178,107,255,.5)" stroke-width="3" stroke-dasharray="2 10"/>
    <circle cx="115" cy="115" r="72" fill="url(#rg)"/><defs><radialGradient id="rg"><stop offset="0" stop-color="rgba(56,243,255,.18)"/><stop offset="1" stop-color="rgba(56,243,255,0)"/></radialGradient></defs></svg>`;
  hero.insertBefore(ring, hero.firstChild);
  const placeRing = () => { ring.style.top = (temp.offsetTop + temp.offsetHeight/2 - 115) + "px"; };
  addEventListener("resize", placeRing); new ResizeObserver(placeRing).observe(temp); placeRing();

  /* 3. 'decoderen' van koppen en conditie */
  const CH = "ABCDEFGHJKLMNOPRSTUVWXYZ0123456789#%&@$<>/";
  const scrambled = new WeakMap();
  function decode(el){
    const target = el.dataset.txt || el.textContent; if(!target.trim()) return;
    el.dataset.txt = target; let f = 0; const total = 18;
    const tick = () => {
      const out = [...target].map((ch, i) => ch === " " ? " " : i < f/total*target.length ? ch : CH[Math.random()*CH.length|0]).join("");
      scrambled.set(el, out); setText(el, out);
      if(++f <= total) setTimeout(tick, 35); else { scrambled.set(el, target); setText(el, target); }
    };
    tick();
  }
  function setText(el, t){ const n = [...el.childNodes].find(n => n.nodeType === 3 && n.textContent.trim()); if(n) n.textContent = t; else el.textContent = t; }
  if(!reduce){
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ io.unobserve(e.target); const n = [...e.target.childNodes].find(n => n.nodeType === 3 && n.textContent.trim()); if(n){ const sp = e.target; sp.dataset.txt = n.textContent; decode(sp); } } }), {threshold:.5});
    const watch = () => document.querySelectorAll(".card h2:not([data-w])").forEach(h => { h.dataset.w = 1; io.observe(h); });
    new MutationObserver(watch).observe(document.body, {childList:true, subtree:true}); watch();
    const cond = $("cond");
    new MutationObserver(() => { if(cond.textContent !== scrambled.get(cond)){ delete cond.dataset.txt; decode(cond); } }).observe(cond, {childList:true, characterData:true, subtree:true});
  }

  /* 4. typemachine voor samenvattingen */
  ["rainSummary","daySummary"].forEach(id => {
    const el = $(id); if(!el || reduce) return; let mine = null, job = 0;
    new MutationObserver(() => {
      if(el.textContent === mine) return; const full = el.textContent; if(!full) return; const me = ++job; let i = 0;
      el.classList.add("caret");
      const t = () => { if(me !== job) return; i += 2; mine = full.slice(0, i); el.textContent = mine; if(i < full.length) setTimeout(t, 18); else { mine = full; el.textContent = full; setTimeout(() => el.classList.remove("caret"), 1200); } };
      t();
    }).observe(el, {childList:true, characterData:true, subtree:true});
  });

  /* 5. 3D-kantelen van kaarten onder je vinger */
  document.addEventListener("animationend", e => { if(e.animationName === "fxin") e.target.classList.remove("fxin"); });
  let tc = null;
  document.addEventListener("pointermove", e => {
    if(e.pointerType === "mouse" && !e.buttons) return;
    const c = e.target.closest(".card"); if(!c || c.querySelector(".radarwrap") || c.classList.contains("fxin")) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
    c.classList.remove("untilt"); c.classList.add("tilt"); tc = c;
    c.style.transform = `perspective(700px) rotateX(${(-y*7).toFixed(2)}deg) rotateY(${(x*9).toFixed(2)}deg) scale(1.01)`;
  }, {passive:true});
  const untilt = () => { if(!tc) return; tc.classList.remove("tilt"); tc.classList.add("untilt"); tc.style.transform = ""; tc = null; };
  ["pointerup","pointercancel","scroll"].forEach(ev => addEventListener(ev, untilt, {passive:true}));

  /* 6. vonkenspoor van je vinger + warp bij vernieuwen */
  const cv = document.createElement("canvas"); cv.id = "trail"; document.body.appendChild(cv);
  const ctx = cv.getContext("2d"); let W, H, sparks = [], streaks = [], loop = false;
  const size = () => { const d = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0); };
  addEventListener("resize", size); size();
  function run(){
    if(loop) return; loop = true;
    const f = () => {
      ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation = "lighter";
      sparks = sparks.filter(s => (s.l -= .035) > 0);
      for(const s of sparks){ s.x += s.vx; s.y += s.vy; s.vy += .05; ctx.fillStyle = `hsla(${s.h},100%,65%,${s.l})`; ctx.beginPath(); ctx.arc(s.x, s.y, 2.2*s.l + .5, 0, 6.3); ctx.fill(); }
      streaks = streaks.filter(s => (s.l -= .022) > 0);
      for(const s of streaks){ s.d += s.v; s.v *= 1.07; const x1 = W/2 + Math.cos(s.a)*s.d, y1 = H*.3 + Math.sin(s.a)*s.d, x0 = W/2 + Math.cos(s.a)*s.d*.7, y0 = H*.3 + Math.sin(s.a)*s.d*.7;
        ctx.strokeStyle = `hsla(${s.h},100%,70%,${s.l})`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); }
      ctx.globalCompositeOperation = "source-over";
      if(sparks.length || streaks.length) requestAnimationFrame(f); else { ctx.clearRect(0,0,W,H); loop = false; }
    };
    requestAnimationFrame(f);
  }
  if(!reduce){
    let lastT = 0;
    document.addEventListener("pointermove", e => {
      if(e.pointerType === "mouse" && !e.buttons) return; if(e.target.closest("#map,.panel")) return;
      const now = performance.now(); if(now - lastT < 16) return; lastT = now;
      for(let i = 0; i < 3; i++) sparks.push({x:e.clientX, y:e.clientY, vx:rnd(-1.2,1.2), vy:rnd(-1.5,.5), l:1, h:rnd(180,280)});
      if(sparks.length > 260) sparks.splice(0, sparks.length - 260); run();
    }, {passive:true});
    const warp = () => { for(let i = 0; i < 140; i++) streaks.push({a:rnd(0,6.3), d:rnd(5,40), v:rnd(2,5), l:1, h:rnd(180,280)}); run(); };
    const br = $("btnRefresh"); br && br.addEventListener("click", warp);
    window.FXwarp = warp;
  }

  /* 7. kantelen van de telefoon = parallax, schudden = vernieuwen */
  let lastShake = 0;
  function onOri(e){ if(e.gamma == null) return; const x = Math.max(-25, Math.min(25, e.gamma)), y = Math.max(-25, Math.min(25, (e.beta || 45) - 45));
    $("fx").style.transform = `translate(${x*.6}px,${y*.6}px)`; $("sky").style.transform = `translate(${x*1.2}px,${y*1.2}px)`; ring.style.translate = `${-x*.4}px ${-y*.4}px`; }
  function onMot(e){ const a = e.accelerationIncludingGravity || e.acceleration; if(!a) return;
    const g = Math.hypot(a.x||0, a.y||0, a.z||0), now = Date.now();
    if(g > 28 && now - lastShake > 3000){ lastShake = now; navigator.vibrate && navigator.vibrate([20,30,20]); const br = $("btnRefresh"); br && br.click(); } }
  function enableSensors(){ if(reduce) return; addEventListener("deviceorientation", onOri); addEventListener("devicemotion", onMot); }
  if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
    document.addEventListener("click", function ask(){ document.removeEventListener("click", ask);
      Promise.all([DeviceOrientationEvent.requestPermission(), typeof DeviceMotionEvent.requestPermission === "function" ? DeviceMotionEvent.requestPermission() : "granted"])
        .then(r => { if(r.includes("granted")) enableSensors(); }).catch(() => {}); });
  } else enableSensors();

  /* 8. uur-iconen golvend laten zweven */
  const stagger = () => document.querySelectorAll(".hour .ic").forEach((el,i) => el.style.animationDelay = (i*.18) + "s");
  new MutationObserver(stagger).observe(document.body, {childList:true, subtree:true}); stagger();
})();
</script>
