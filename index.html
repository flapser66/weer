<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weer</title>
<meta name="theme-color" content="#060b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="bg"></div><div id="grid"></div>
<canvas id="fx"></canvas><canvas id="trail"></canvas><div id="flash"></div>
<div class="ptr" id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></div>

<div class="wrap">
  <div class="topbar">
    <button class="iconbtn" id="btnPlaces" aria-label="Plaatsen"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
    <div class="sp"></div>
    <button class="iconbtn" id="btnRefresh" aria-label="Vernieuwen"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="iconbtn" id="btnSettings" aria-label="Instellingen"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>

  <div id="status" class="msg">Weer ophalen…</div>

  <main id="main" class="hidden">
    <section class="hero" id="hero">
      <div class="place" id="place"></div>
      <div class="dots" id="dots"></div>
      <div class="temp" id="temp"></div>
      <div class="cond" id="cond"></div>
      <div class="hilo" id="hilo"></div>
      <div class="updated" id="updated"></div>
      <div class="solar" id="solar"></div>
      <div class="now" id="now"></div>
      <div class="chips" id="chips"></div>
    </section>

    <div id="warnings"></div>

    <div id="cards">
      <section class="card radar noskew" id="radarCard">
        <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12l6-4"/></svg><span>Regenradar</span></h2>
        <div class="radarwrap" id="radarWrap">
          <div id="map"></div>
          <button class="radarfs" id="radarFs" aria-label="Volledig scherm"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <div class="legend"><span>licht</span><i></i><span>zwaar</span></div>
          <div class="radarctl">
            <button id="radarPlay" aria-label="Afspelen"></button>
            <input type="range" id="radarSlider" min="0" max="0" value="0">
            <span class="rt" id="radarTime">--:--</span><span class="rt" id="radarSrc" style="min-width:0;font-size:10px;opacity:.6"></span>
          </div>
        </div>
      </section>
    </div>
    <div id="park" class="hidden"></div>

    <div class="foot">
      Data: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (o.a. KNMI Harmonie) ·
      radar &amp; 2 uur: <a href="https://www.buienradar.nl" target="_blank" rel="noopener">Buienradar</a> / <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a> ·
      waarschuwingen: MeteoAlarm · kaart: Esri<br>WEER//OS v2
    </div>
  </main>
</div>

<div class="sheet" id="places">
  <div class="panel">
    <h3>PLAATSEN <button class="iconbtn" data-close="places" aria-label="Sluiten"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <input class="search" id="search" type="search" placeholder="Zoek een plaats" autocomplete="off">
    <div class="plist" id="results"></div>
    <div class="label">Jouw plaatsen</div>
    <div class="ptext">Tip: veeg op het dashboard naar links of rechts om tussen je plaatsen te wisselen.</div>
    <div class="plist" id="saved"></div>
  </div>
</div>

<div class="sheet" id="settings">
  <div class="panel">
    <h3>INSTELLINGEN <button class="iconbtn" data-close="settings" aria-label="Sluiten"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div id="settingsBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
