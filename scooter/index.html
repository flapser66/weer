<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scooter Navigatie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1216;color:#fff;overflow:hidden;user-select:none}
#map{position:fixed;inset:0}
#map canvas{filter:brightness(var(--br,1))}
.hide{display:none!important}
.card{background:#1b2027;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
button{font-family:inherit;cursor:pointer}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:10}
#qwrap{display:flex;align-items:center;padding:4px 6px 4px 4px}
#menuOpen{background:none;border:0;color:#fff;font-size:22px;width:46px;height:46px;border-radius:12px}
#q{flex:1;min-width:0;background:none;border:0;color:#fff;font-size:17px;padding:12px 4px;outline:none}
#q::placeholder{color:#8b949e}
#qclear{background:none;border:0;color:#8b949e;font-size:22px;padding:8px 10px}
#sug{margin-top:6px;max-height:55vh;overflow:auto}
.si{padding:13px 16px;border-bottom:1px solid #2b323b;font-size:15px}
.si:last-child{border:0}.si small{color:#8b949e;display:block;margin-top:2px}
.si{display:flex;align-items:center;gap:8px}.si .st{flex:1;min-width:0}
.si .del{border:0;background:#30363d;color:#c9d1d9;border-radius:8px;padding:6px 10px;font-size:13px;flex:none}
.sh{padding:9px 16px 5px;font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #2b323b}
.si.act{color:#ff7b72;justify-content:center;font-size:14px}
.seg.wrap{flex-wrap:wrap;gap:3px}.seg.wrap button{flex:1 0 30%}
#chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-right:64px}
#chips:empty{display:none}#sug:not(.hide)~#chips{display:none}
.chip{border:0;background:#1b2027;color:#fff;border-radius:20px;padding:9px 15px;font-size:14px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#preview{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;padding:14px 14px 12px;max-height:72vh;overflow:auto}
#pvName{font-size:18px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pvSum{color:#e6edf3;font-size:15px;margin-bottom:4px}
#pvExtra{color:#9aa4ae;font-size:13px;margin-bottom:10px;min-height:16px}
#alts{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
#alts:empty{display:none}
#alts button{border:1px solid #30363d;background:#0d1117;color:#c9d1d9;padding:7px 10px;border-radius:10px;font-size:13px;white-space:nowrap;text-align:left;line-height:1.3}
#alts button.on{border-color:#2f81f7;background:#10264a;color:#fff}
#vias div{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px;color:#c9d1d9}
#vias span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vias button{border:0;background:#30363d;color:#fff;border-radius:8px;padding:4px 10px}
.row{display:flex;gap:8px;margin-bottom:10px}
.seg{flex:1;display:flex;background:#0d1117;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:#8b949e;padding:9px 4px;border-radius:8px;font-size:14px}
.seg button.on{background:#2f81f7;color:#fff;font-weight:600}
.small{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.small button{border:0;background:#0d1117;color:#c9d1d9;padding:9px 11px;border-radius:10px;font-size:13px;white-space:nowrap}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;color:#fff;background:#30363d}
.btn.go{background:#2f81f7;flex:1;font-size:18px}
#instr{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:10;display:flex;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#iArrow{width:104px;background:#0b57d0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;flex:none}
#iArrow svg{width:64px;height:64px}
#iDist{font-size:24px;font-weight:800;margin-top:2px;white-space:nowrap}
#iMain{flex:1;min-width:0;background:#1b2027;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
#iStreet{font-size:22px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#iSub{font-size:14px;color:#9aa4ae;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#iThen{position:fixed;top:calc(126px + env(safe-area-inset-top));left:10px;z-index:9;background:#08408f;border-radius:0 0 12px 12px;padding:5px 12px 6px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
#iThen svg{width:22px;height:22px}
#camWarn{position:fixed;left:10px;top:calc(168px + env(safe-area-inset-top));z-index:9;background:#d1242f;padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#prog{position:fixed;right:10px;top:calc(150px + env(safe-area-inset-top));bottom:calc(150px + env(safe-area-inset-bottom));width:10px;background:rgba(0,0,0,.45);border-radius:6px;z-index:9;overflow:hidden}
#progFill{position:absolute;left:0;right:0;bottom:0;background:#4c9aff;border-radius:6px}
#curStreet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));z-index:9;background:rgba(15,18,22,.85);padding:6px 14px;border-radius:10px;font-size:15px;font-weight:600;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#1b2027;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;box-shadow:0 -4px 20px rgba(0,0,0,.45)}
#spdBox{display:flex;align-items:center;gap:6px}
#spdNow{width:64px;height:64px;border-radius:14px;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .3s}
#spdNow b{font-size:28px}#spdNow small{font-size:10px;color:#9aa4ae;margin-top:2px}
#spdNow.over{background:#da3633}#spdNow.over small{color:#fff}
#limit{width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid #d1242f;color:#111;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.stat{flex:1;text-align:center;line-height:1.1;min-width:0}
.stat b{display:block;font-size:21px;font-weight:800;white-space:nowrap}
.stat small{font-size:11px;color:#9aa4ae;text-transform:uppercase;letter-spacing:.04em}
#menuBtn{width:46px;height:46px;border-radius:12px;border:0;background:#30363d;color:#fff;font-size:22px;flex:none}
#navMenu{position:fixed;right:10px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:11;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:230px;max-height:70vh;overflow:auto}
#navMenu button{border:0;background:#262c34;color:#fff;font-size:16px;padding:13px 14px;border-radius:10px;text-align:left}
#navMenu button.stop{background:#da3633}
#speedIdle{position:fixed;left:14px;z-index:9;width:62px;height:62px;border-radius:50%;background:#fff;color:#111;border:4px solid #30363d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1;bottom:calc(24px + env(safe-area-inset-bottom))}
#speedIdle small{font-size:10px;font-weight:600}
#limitIdle{position:fixed;left:22px;z-index:9;bottom:calc(94px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid #d1242f;color:#111;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#speedIdle.over{background:#da3633;color:#fff;border-color:#da3633}
#limitName{position:fixed;left:76px;z-index:9;bottom:calc(104px + env(safe-area-inset-bottom));background:rgba(15,18,22,.85);padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.nav #limitIdle,body.preview #limitIdle,body.nav #limitName,body.preview #limitName{display:none}
#gpsAcc{position:fixed;left:14px;z-index:9;bottom:calc(148px + env(safe-area-inset-bottom));background:rgba(15,18,22,.85);padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600}
#gpsAcc.bad{background:#9a6700}
body.nav #gpsAcc{bottom:calc(98px + env(safe-area-inset-bottom));left:auto;right:28px}
#recenter{position:fixed;right:14px;z-index:9;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:#1b2027;color:#58a6ff;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4)}
body.nav #recenter{bottom:calc(150px + env(safe-area-inset-bottom));right:28px}
.sideBtn{position:fixed;right:14px;z-index:9;width:48px;height:48px;border-radius:50%;border:0;background:#1b2027;color:#fff;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#themeBtn{top:calc(128px + env(safe-area-inset-top))}
#nearBtn{top:calc(184px + env(safe-area-inset-top))}
body.nav .sideBtn,body.preview .sideBtn,body.preview #recenter,body.preview #speedIdle,body.preview #gpsAcc{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:42%;z-index:40;background:rgba(0,0,0,.88);padding:12px 18px;border-radius:12px;font-size:15px;max-width:85vw;text-align:center}
#offline{position:fixed;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:12;background:#9a6700;padding:5px 12px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap}
body.nav #offline{top:auto;bottom:calc(140px + env(safe-area-inset-bottom))}
#resume{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:14;padding:16px}
#shade{position:fixed;inset:0;z-index:24;background:rgba(0,0,0,.45)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;max-height:84vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
#sheetHead{display:flex;align-items:center;padding:12px 14px 12px 18px;border-bottom:1px solid #2b323b}
#sheetTitle{flex:1;font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheetBack,#sheetClose{border:0;background:#30363d;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;flex:none}
#sheetBack{margin-right:10px}
#sheetBody{overflow:auto;padding:4px 16px 18px}
.li{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #2b323b;font-size:15px}
.li:last-child{border-bottom:0}
.li .ic{width:30px;text-align:center;font-size:20px;flex:none}.li .ic svg{width:28px;height:28px}
.li .tx{flex:1;min-width:0}.li .tx small{display:block;color:#8b949e;margin-top:2px;font-size:13px}
.li .rt{color:#c9d1d9;font-size:14px;white-space:nowrap}
.li.click:active{background:#262c34}
.opt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2b323b;font-size:15px;gap:12px}
.opt small{display:block;color:#8b949e;font-size:12px;margin-top:2px}
.sw{width:52px;height:30px;border-radius:15px;background:#30363d;position:relative;border:0;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#238636}.sw.on::after{left:25px}
.sec{color:#8b949e;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 6px}
input[type=range]{width:100%;accent-color:#2f81f7;height:32px}
#dlg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
#dlg .card{width:100%;max-width:380px;padding:18px}
#dlgIn{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#fff;margin:10px 0 14px;outline:none;color-scheme:dark}
.me{width:46px;height:46px}
.maplibregl-ctrl-attrib{font-size:10px}
body.glove #top,body.glove #preview,body.glove #bar,body.glove #navMenu,body.glove #instr,body.glove #sheet,body.glove .sideBtn,body.glove #recenter,body.glove #resume{zoom:1.22}
@media (orientation:landscape){
  #instr{right:auto;width:48%}
  #preview,#resume{left:auto;width:min(460px,58%)}
  #top{right:auto;width:min(460px,55%)}
  #prog,#iThen{display:none}
  #sheet{left:auto;width:min(520px,70%);right:10px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="qwrap" class="card">
    <button id="menuOpen" aria-label="Menu">☰</button>
    <input id="q" placeholder="Waar wil je heen?" autocomplete="off" enterkeyhint="search">
    <button id="qclear" class="hide">✕</button>
  </div>
  <div id="sug" class="card hide"></div>
  <div id="chips"></div>
</div>

<div id="preview" class="card hide">
  <div id="pvName"></div>
  <div id="pvSum">Route berekenen…</div>
  <div id="pvExtra"></div>
  <div id="alts"></div>
  <div id="vias"></div>
  <div class="row">
    <div class="seg" id="segType">
      <button data-v="snor">🟦 Blauw · 25</button>
      <button data-v="brom">🟨 Geel · 45</button>
    </div>
  </div>
  <div class="small">
    <button id="pvOpts">⚙ Route-opties</button>
    <button id="pvVia">＋ Tussenstop</button>
    <button id="pvList">☰ Afslagen</button>
    <button id="pvDep">🕗 Vertrek</button>
    <button id="pvShare">⤴ Deel</button>
  </div>
  <div class="row" style="margin:0">
    <button class="btn" id="pvClose">✕</button>
    <button class="btn" id="pvSave">★</button>
    <button class="btn go" id="pvGo">Start</button>
  </div>
</div>

<div id="instr" class="hide">
  <div id="iArrow"><div id="iIcon"></div><div id="iDist">–</div></div>
  <div id="iMain"><div id="iStreet"></div><div id="iSub"></div></div>
</div>
<div id="iThen" class="hide"><span>Daarna</span><span id="iThenIcon"></span></div>
<div id="camWarn" class="hide"></div>
<div id="prog" class="hide"><div id="progFill"></div></div>
<div id="curStreet" class="hide"></div>
<div id="bar" class="hide">
  <div id="spdBox">
    <div id="spdNow"><b id="spd">0</b><small>km/u</small></div>
    <div id="limit" class="hide"></div>
  </div>
  <div class="stat"><b id="sEta">--:--</b><small>Aankomst</small></div>
  <div class="stat"><b id="sTime">–</b><small>Reistijd</small></div>
  <div class="stat"><b id="sDist">–</b><small>Afstand</small></div>
  <button id="menuBtn" aria-label="Navigatiemenu">⋮</button>
</div>
<div id="navMenu" class="card hide">
  <button id="mVoice"></button>
  <button id="mBeep"></button>
  <button id="mList">☰ Afslagenlijst</button>
  <button id="mNear">⛽ Tankstation / in de buurt</button>
  <button id="mShare">⤴ Deel aankomsttijd</button>
  <button id="mOver">🗺 Route-overzicht</button>
  <button id="mMenu">⚙ Menu & instellingen</button>
  <button id="mStop" class="stop">✕ Navigatie stoppen</button>
</div>

<div id="gpsAcc" class="hide"></div>
<div id="limitIdle" class="hide"></div>
<div id="limitName" class="hide"></div>
<div id="speedIdle"><span id="spdIdle">0</span><small>km/u</small></div>
<button id="recenter" class="hide">⌖</button>
<button id="themeBtn" class="sideBtn" aria-label="Kaart">🌓</button>
<button id="nearBtn" class="sideBtn" aria-label="In de buurt">⛽</button>
<div id="toast" class="hide"></div>
<div id="offline" class="hide">Offline – route gaat door, zoeken kan niet</div>
<div id="resume" class="card hide">
  <div id="rsTxt" style="margin-bottom:12px;font-size:16px"></div>
  <div class="row" style="margin:0"><button class="btn" id="rsNo" style="flex:1">Nee</button><button class="btn go" id="rsYes">Hervatten</button></div>
</div>
<div id="shade" class="hide"></div>
<div id="sheet" class="card hide">
  <div id="sheetHead"><button id="sheetBack" class="hide">‹</button><div id="sheetTitle"></div><button id="sheetClose">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="dlg" class="hide"><div class="card">
  <div id="dlgTitle" style="font-size:17px;font-weight:600"></div>
  <input id="dlgIn">
  <div class="row" style="margin:0"><button class="btn" id="dlgNo" style="flex:1">Annuleer</button><button class="btn go" id="dlgOk">OK</button></div>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- instellingen & opslag ---------- */
const DEF={type:'snor',chime:'ding',autoDl:true,idleLimit:true,quiet:false,ferry:true,unpaved:false,living:false,cams:true,voice:true,beep:true,rate:1.05,vol:1,warn:'normaal',
  theme:'auto',bright:100,view3d:true,orient:'heading',glove:false,svcKm:2000,svcLast:null,odoOffset:0};
const settings=Object.assign({},DEF,load('sn_set',{}));
const saveSet=()=>store('sn_set',settings);
let places=load('sn_places',[]),recents=load('sn_recent',[]),hist=load('sn_hist',null),trips=load('sn_trips',[]),odo=+load('sn_odo',0)||0;
const S={pos:null,acc:0,heading:0,speed:0,lastT:0,lastFix:0,dest:null,destName:'',vias:[],viaMarkers:[],routes:[],sel:0,
  shape:[],cum:[],man:[],sum:null,enc:'',limits:[],cams:[],navigating:false,follow:true,idx:0,off:0,lastReroute:0,
  announced:{},camAnn:{},wake:null,busy:false,firstFix:false,snap:null,dTo:null,along:0,mi:0,mode:null,dep:null,
  trip:null,etaF:1,etaS:[],lastOdoPos:null,wx:'',wxKey:'',dl:false,autoStart:false};
const VALHALLA='https://valhalla1.openstreetmap.de',OVERPASS='https://overpass-api.de/api/interpreter';
const plateMax=()=>settings.type==='snor'?25:45;
const WARN={vroeg:1.6,normaal:1,laat:.65};
document.body.classList.toggle('glove',settings.glove);

/* ---------- kaart ---------- */
function styleUrl(){const h=new Date().getHours();const n=settings.theme==='night'||(settings.theme==='auto'&&(h>=18||h<7));
  return 'https://tiles.openfreemap.org/styles/'+(n?'fiord':'liberty')}
const map=new maplibregl.Map({container:'map',style:styleUrl(),center:[6.118,51.862],zoom:14,
  attributionControl:{compact:true},pitchWithRotate:true,maxPitch:70});
map._curStyle=styleUrl();
const fc=f=>({type:'FeatureCollection',features:f});
const line=c=>({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:c}});
const emptyLine=()=>line([]);
const toLngLat=a=>a.map(p=>[p[1],p[0]]);
function add3D(){
  if(map.getLayer('b3d')||!map.getSource('openmaptiles'))return;
  const nt=(map._curStyle||'').includes('fiord');
  (map.getStyle().layers||[]).forEach(l=>{if(l.type==='fill-extrusion')map.setLayoutProperty(l.id,'visibility','none')});
  map.addLayer({id:'b3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:14,
    layout:{visibility:settings.view3d?'visible':'none'},
    paint:{'fill-extrusion-color':nt?'#46516d':'#ddd6cb','fill-extrusion-height':['coalesce',['get','render_height'],7],
      'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.9}});
  try{map.setSky(nt?{'sky-color':'#0b1630','horizon-color':'#2a3a5e','fog-color':'#1b2540','sky-horizon-blend':.6,'horizon-fog-blend':.6,'fog-ground-blend':.7}

const R=6371000,rad=x=>x*Math.PI/180;
function dist(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);const q=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(Math.atan2(y,x)*180/Math.PI+360)%360}
function proj(p,a,b){const k=Math.cos(rad(p[0]));const ax=a[1]*k,ay=a[0],dx=b[1]*k-ax,dy=b[0]-ay;const L2=dx*dx+dy*dy;
  let t=L2?((p[1]*k-ax)*dx+(p[0]-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));const q=[ay+t*dy,(ax+t*dx)/k];return{d:dist(p,q),t,q}}
function decode(s,prec=6){let i=0,la=0,lo=0;const o=[],f=10**prec;while(i<s.length){for(const w of[0,1]){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const v=(r&1)?~(r>>1):(r>>1);if(w)lo+=v;else la+=v}o.push([la/f,lo/f])}return o}
function encode(pts,prec=6){const f=10**prec;let out='',pa=0,po=0;
  const enc=v=>{v=v<0?~(v<<1):(v<<1);let s='';while(v>=0x20){s+=String.fromCharCode((0x20|(v&0x1f))+63);v>>=5}return s+String.fromCharCode(v+63)};
  for(const[la,lo]of pts){const a=Math.round(la*f),b=Math.round(lo*f);out+=enc(a-pa)+enc(b-po);pa=a;po=b}return out}
function tileXY(la,lo,z){const n=2**z;return[Math.floor((lo+180)/360*n),Math.floor((1-Math.log(Math.tan(rad(la))+1/Math.cos(rad(la)))/Math.PI)/2*n)]}
const nl1=x=>x.toFixed(1).replace('.',',');
function fmtD(m){m=Math.max(0,m);return m<1000?(m<100?Math.round(m/5)*5:Math.round(m/10)*10)+' m':(m<10000?nl1(m/1000):Math.round(m/1000))+' km'}
function sayD(m){return m<1000?Math.max(50,Math.round(m/50)*50)+' meter':nl1(m/1000).replace(',0','')+' kilometer'}
function fmtT(s){const m=Math.max(0,Math.round(s/60));return m<60?m+' min':Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' u'}
const hm=d=>d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
const clock=s=>hm(new Date(Date.now()+s*1000));
const compass=b=>['noord','noordoost','oost','zuidoost','zuid','zuidwest','west','noordwest'][Math.round(b/45)%8];

  navigator.geolocation.watchPosition(onPos,err=>{if(err.code===1)toast('Geef toestemming voor je locatie (Instellingen → Apps → Locatie → Precies)',5000)},
    {enableHighAccuracy:true,maximumAge:1000,timeout:20000});

function onPos(p){
  const c=p.coords,ll=[c.latitude,c.longitude],now=p.timestamp||Date.now();
  if(S.pos){const d=dist(S.pos,ll),dt=(now-S.lastT)/1000;
    const sp=(c.speed!=null&&!isNaN(c.speed))?c.speed*3.6:(dt>0&&d>(c.accuracy||0)*0.5?d/dt*3.6:0);
    S.speed=sp<2?0:S.speed*0.3+sp*0.7;
    let hd=null;
    if(c.heading!=null&&!isNaN(c.heading)&&S.speed>4)hd=c.heading;
    else if(S.speed>4&&d>Math.max(5,(c.accuracy||0)*0.5))hd=bearing(S.pos,ll);
    if(hd!=null)S.heading=(S.heading+angDiff(S.heading,hd)*0.6+360)%360;
  }else if(c.speed!=null&&!isNaN(c.speed))S.speed=c.speed*3.6;
  S.lastT=now;S.lastFix=Date.now();S.pos=ll;S.acc=c.accuracy||0;
  if(S.acc<30){
    if(S.lastOdoPos&&S.speed>3){const d=dist(S.lastOdoPos,ll);if(d<300){odo+=d;if(S.trip){S.trip.dist+=d;S.trip.max=Math.max(S.trip.max,S.speed)}}}
    S.lastOdoPos=ll;
  }
  if(Date.now()-(S.odoSaved||0)>20000){S.odoSaved=Date.now();store('sn_odo',odo)}
  const sp=Math.round(S.speed);$('spd').textContent=sp;$('spdIdle').textContent=sp;
  const ga=$('gpsAcc');ga.textContent='GPS ±'+Math.round(S.acc)+' m';ga.classList.remove('hide');ga.classList.toggle('bad',S.acc>30);
  if(S.acc>500&&!S.warnedAcc){S.warnedAcc=1;toast('Locatie is onnauwkeurig: zet "Precieze locatie" aan in je Android-instellingen',5000)}
  meMarker.setLngLat([ll[1],ll[0]]).setRotation(S.heading);
  if(!meAdded){meMarker.addTo(map);meAdded=true}
  S.snap=null;
  if(S.navigating)navTick();else idleLimit(ll);
  if(!S.firstFix){S.firstFix=true;map.jumpTo({center:[ll[1],ll[0]],zoom:16.5,pitch:settings.view3d?50:0})}
  else if(S.follow)camera(false);
}
function camera(instant){
  if(!S.pos)return;
  const pp=(S.navigating&&S.snap)||S.pos,c=[pp[1],pp[0]];
  const brg=settings.orient==='north'?0:(S.navigating||S.speed>4?S.heading:map.getBearing());

      padding:{top:Math.round(innerHeight*0.42),bottom:90,left:0,right:0}});

function showIdleLimit(){const max=S.roadLimit?Math.min(S.roadLimit,plateMax()):plateMax();$('limitIdle').textContent=S.roadLimit||'';$('limitIdle').classList.toggle('hide',!S.roadLimit);$('limitName').textContent=S.roadName||'';$('limitName').classList.toggle('hide',!S.roadLimit||!S.roadName);

async function overpassLimit(ll){ // reserve: dichtstbijzijnde weg met maxspeed-bord binnen 120 m
  const q=`[out:json][timeout:15];way(around:120,${ll[0]},${ll[1]})["highway"~"^(trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road)(_link)?$"]["maxspeed"];out tags geom;`;
  const j=await(await fetch(OVERPASS,{method:'POST',body:q})).json();let best=null;
  for(const w of j.elements||[]){const ms=(w.tags&&w.tags.maxspeed)||'',v={'NL:urban':50,'NL:rural':80,'NL:zone30':30,'NL:zone60':60}[ms]||parseInt(ms);if(!(v>0&&v<200))continue;const g=w.geometry||[];
    for(let i=0;i<g.length-1;i++){const r=proj(ll,[g[i].lat,g[i].lon],[g[i+1].lat,g[i+1].lon]);if(!best||r.d<best.d)best={d:r.d,v,name:(w.tags.name||'')}}}
  return best&&best.d<=120?best:null;
}
async function idleLimit(ll){
  if(!settings.idleLimit){if(S.roadLimit){S.roadLimit=0;showIdleLimit()}return}
  S.trail=(S.trail||[]);if(S.acc<30){S.trail.push(ll);if(S.trail.length>6)S.trail.shift()}
  showIdleLimit();
  if(S.limBusy||!navigator.onLine)return;
  if(S.speed<4){ // stilstaan: dichtstbijzijnde weg opzoeken
    if(S.acc>80||Date.now()-(S.limT||0)<5000||(S.locLL&&dist(S.locLL,ll)<15&&Date.now()-S.limT<60000))return;
    S.limBusy=true;S.limT=Date.now();S.locLL=ll;
    let res=null;
    try{const j=await post('/locate',{locations:[{lat:ll[0],lon:ll[1],radius:120}],costing:'motor_scooter',verbose:true});
      const e=((j&&j[0]&&j[0].edges)||[]).filter(x=>{const v=+(x.edge_info&&x.edge_info.speed_limit);return v>0&&v<200&&x.distance<120}).sort((x,y)=>x.distance-y.distance)[0];
      if(e)res={v:+e.edge_info.speed_limit,name:(e.edge_info.names||[])[0]||'',d:e.distance};
    }catch(e){}
    if(!res)try{res=await overpassLimit(ll)}catch(e){}
    S.roadLimit=res?res.v:0;S.roadName=res?res.name:'';showIdleLimit();
    S.limBusy=false;return;
  }
  if(S.trail.length<3||Date.now()-(S.limT||0)<8000)return;
  if(dist(S.trail[0],S.trail[S.trail.length-1])<25)return;
  S.limBusy=true;S.limT=Date.now();
  try{const j=await post('/trace_attributes',{shape:S.trail.map(p=>({lat:p[0],lon:p[1]})),shape_match:'map_snap',costing:'motor_scooter',
      filters:{attributes:['edge.speed_limit','edge.names'],action:'include'}});
    const e=(j.edges||[]).slice(-1)[0];S.roadLimit=e&&typeof e.speed_limit==='number'&&e.speed_limit>0&&e.speed_limit<200?e.speed_limit:0;S.roadName=(e&&e.names&&e.names[0])||'';S.locLL=null;showIdleLimit();
  }catch(e){}
  S.limBusy=false;
}

async function post(path,body){const r=await fetch(VALHALLA+path,{method:'POST',body:JSON.stringify(body)});return r.json()}
const bikeMode=()=>settings.type==='snor'; // blauw kenteken: fietspaden meenemen
const costName=()=>bikeMode()?'bicycle':'motor_scooter';
function costing(){
  if(bikeMode())return{bicycle:{bicycle_type:'Hybrid',cycling_speed:25,use_roads:settings.quiet?0.05:0.15,use_hills:0.5,
    use_ferry:settings.ferry?0.5:0,avoid_bad_surfaces:settings.unpaved?0.9:0.25,use_living_streets:settings.living?0.05:0.5}};
  return{motor_scooter:{top_speed:plateMax(),use_primary:settings.quiet?0.1:0.5,use_hills:0.5,
  use_ferry:settings.ferry?0.5:0,exclude_unpaved:!!settings.unpaved,use_living_streets:settings.living?0.05:0.5}}}
function parseTrip(t){let shape=[];const man=[];
  t.legs.forEach((leg,li)=>{const off=shape.length,pts=decode(leg.shape);
    leg.maneuvers.forEach(m=>man.push(Object.assign({},m,{begin_shape_index:m.begin_shape_index+off,end_shape_index:m.end_shape_index+off,leg:li,lastLeg:li===t.legs.length-1})));
    shape=shape.concat(pts)});
  const cum=[0];for(let i=1;i<shape.length;i++)cum.push(cum[i-1]+dist(shape[i-1],shape[i]));
  return{shape,cum,man,sum:t.summary,enc:encode(shape)};
}
async function fetchRoutes(from,useHeading,wantAlts){
  const loc0={lat:from[0],lon:from[1]};
  if(useHeading&&S.speed>8){loc0.heading=Math.round(S.heading);loc0.heading_tolerance=60}
  const body={locations:[loc0,...S.vias.map(v=>({lat:v.ll[0],lon:v.ll[1],type:'break'})),{lat:S.dest[0],lon:S.dest[1]}],
    costing:costName(),costing_options:costing(),directions_options:{language:'nl-NL',units:'kilometers'}};
  if(wantAlts&&!S.vias.length)body.alternates=2;
  const j=await post('/route',body);
  if(!j.trip)throw new Error(j.error||'Geen route gevonden');
  let routes=[j.trip,...(j.alternates||[]).map(a=>a.trip).filter(Boolean)].map(parseTrip);
  if(bikeMode()){ // paden waar snorfietsen volgens OpenStreetMap niet mogen: uitsluiten en opnieuw rekenen
    try{const ways=await getNoSnorWays(bboxOf(routes));
      let bad=[];routes.forEach(r=>bad.push(...badPoints(r,ways)));
      if(bad.length){body.exclude_locations=bad.slice(0,50).map(p=>({lat:p[0],lon:p[1]}));
        const j2=await post('/route',body);
        if(j2.trip){routes=[j2.trip,...(j2.alternates||[]).map(a=>a.trip).filter(Boolean)].map(parseTrip);routes.forEach(r=>r.warn=badPoints(r,ways).length>0)}
        else routes.forEach(r=>r.warn=true)}
    }catch(e){}
  }
  return routes;
}
function bboxOf(routes){let s=90,w=180,n=-90,e=-180;routes.forEach(r=>r.shape.forEach(([a,b])=>{s=Math.min(s,a);n=Math.max(n,a);w=Math.min(w,b);e=Math.max(e,b)}));return[s,w,n,e]}
async function getNoSnorWays(bb){
  const c=S.mofaCache;if(c&&c.bb[0]<=bb[0]&&c.bb[1]<=bb[1]&&c.bb[2]>=bb[2]&&c.bb[3]>=bb[3])return c.ways;
  const m=.01,B=[bb[0]-m,bb[1]-m,bb[2]+m,bb[3]+m];if(B[2]-B[0]>0.6||B[3]-B[1]>0.9)return[];
  const box=B.map(x=>x.toFixed(5)).join(',');
  const q=`[out:json][timeout:25];(way["mofa"="no"](${box});way["highway"~"^(footway|pedestrian|steps)$"]["mofa"!~"^(yes|designated)$"]["moped"!~"^(yes|designated)$"](${box}););out geom;`;
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
  try{const j=await(await fetch(OVERPASS,{method:'POST',body:q,signal:ctl.signal})).json();
    const ways=(j.elements||[]).map(w=>(w.geometry||[]).map(g=>[g.lat,g.lon])).filter(g=>g.length>1);
    S.mofaCache={bb:B,ways};return ways}finally{clearTimeout(t)}
}
function badPoints(rt,ways){
  if(!ways.length)return[];const pts=[];let last=-1e9;
  const wb=ways.map(g=>{let s=90,w=180,n=-90,e=-180;for(const[a,b]of g){s=Math.min(s,a);n=Math.max(n,a);w=Math.min(w,b);e=Math.max(e,b)}return[s-.0002,w-.0003,n+.0002,e+.0003]});
  for(let i=0;i<rt.shape.length-1;i++){const a=rt.shape[i],b=rt.shape[i+1],len=rt.cum[i+1]-rt.cum[i];if(len<4)continue;
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    for(let k=0;k<ways.length;k++){const B=wb[k];if(mid[0]<B[0]||mid[0]>B[2]||mid[1]<B[1]||mid[1]>B[3])continue;
      const g=ways[k];let hit=false;for(let j=0;j<g.length-1;j++)if(proj(mid,g[j],g[j+1]).d<3){hit=true;break}
      if(hit){const al=rt.cum[i]+len/2;if(al-last>40){pts.push(mid);last=al}break}}}
  return pts;
}
async function fetchLimits(rt){
  const lim=new Array(rt.shape.length).fill(0);
  try{const j=await post('/trace_attributes',{encoded_polyline:rt.enc,shape_match:'edge_walk',costing:costName(),
      filters:{attributes:['edge.speed_limit','edge.begin_shape_index','edge.end_shape_index'],action:'include'}});
    (j.edges||[]).forEach(e=>{const v=typeof e.speed_limit==='number'?e.speed_limit:0;
      for(let i=e.begin_shape_index;i<=e.end_shape_index&&i<lim.length;i++)lim[i]=v});
  }catch(e){}
  return lim;
}
async function fetchCams(rt){
  if(!settings.cams)return[];
  let s=90,w=180,n=-90,e=-180;for(const[la,lo]of rt.shape){s=Math.min(s,la);n=Math.max(n,la);w=Math.min(w,lo);e=Math.max(e,lo)}
  if(n-s>1.5||e-w>2.5)return[];
  const m=.003,q=`[out:json][timeout:20];node["highway"="speed_camera"](${s-m},${w-m},${n+m},${e+m});out;`;
  try{const j=await(await fetch(OVERPASS,{method:'POST',body:q})).json();const out=[];
    (j.elements||[]).forEach(el=>{const p=[el.lat,el.lon];let best={d:1e9,i:0,t:0};
      for(let i=0;i<rt.shape.length-1;i++){const r=proj(p,rt.shape[i],rt.shape[i+1]);if(r.d<best.d)best={d:r.d,i,t:r.t}}
      if(best.d<30)out.push({id:el.id,ll:p,max:el.tags?.maxspeed||'',along:rt.cum[best.i]+best.t*(rt.cum[best.i+1]-rt.cum[best.i])})});
    return out.sort((a,b)=>a.along-b.along);
  }catch(e){return[]}
}
function applyRoute(rt){
  Object.assign(S,{etaS:[],shape:rt.shape,cum:rt.cum,man:rt.man,sum:rt.sum,enc:rt.enc,idx:0,off:0,announced:{},camAnn:{},limits:[],cams:[]});
  drawRoute();
  fetchLimits(rt).then(l=>{if(S.enc===rt.enc)S.limits=l});
  fetchCams(rt).then(c=>{if(S.enc===rt.enc){S.cams=c;setCams()}});
  prefetchTiles(rt.shape);
}
function setCams(){if(map.getSource('cams'))map.getSource('cams').setData(fc(S.cams.map(c=>({type:'Feature',properties:{},geometry:{type:'Point',coordinates:[c.ll[1],c.ll[0]]}}))))}
function drawRoute(){

  setCams();
}
function prefetchTiles(shape){
  const tpl=map.getSource('openmaptiles')?.tiles?.[0];if(!tpl)return;
  const set=new Set();
  for(const z of[12,13,14])for(const[la,lo]of shape){const[x,y]=tileXY(la,lo,z);for(const dx of[-1,0,1])for(const dy of[-1,0,1])set.add(z+'/'+(x+dx)+'/'+(y+dy))}
  const urls=[...set].map(k=>{const[z,x,y]=k.split('/');return tpl.replace('{z}',z).replace('{x}',x).replace('{y}',y)});
  let i=0;const w=async()=>{while(i<urls.length){try{await fetch(urls[i++])}catch(e){}}};for(let k=0;k<4;k++)w();
}

function arrowSVG(type){

  if(type===26||type===27)return`<svg viewBox="0 0 100 100"><circle cx="50" cy="54" r="20" fill="none" stroke="${W}" stroke-width="10" opacity=".55"/><path d="M50 96V74" stroke="${W}" stroke-width="12"/><path d="M64 40L80 22" stroke="${W}" stroke-width="12"/><polygon points="72,10 92,10 92,30" fill="${W}"/></svg>`;
  if(type===28||type===29)return`<svg viewBox="0 0 100 100"><path d="M14 60h72l-10 20H24z" fill="${W}"/><path d="M34 58V36h32v22" fill="none" stroke="${W}" stroke-width="8"/><path d="M8 90q10-8 21 0t21 0 21 0 21 0" fill="none" stroke="${W}" stroke-width="6"/></svg>`;
  const A={9:45,10:90,11:135,14:-135,15:-90,16:-45,18:35,20:35,23:30,19:-35,21:-35,24:-30}[type]||0;

function say(t){if(!settings.voice||!('speechSynthesis' in window)||!t)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';u.rate=+settings.rate||1;u.volume=+settings.vol;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('nl'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const lc=s=>s?s.charAt(0).toLowerCase()+s.slice(1):'';
let AC=null;
function beep(){try{AC=AC||new AudioContext();[0,.2].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.3*(+settings.vol||1),AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.15);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.16)})}catch(e){}}
const CHIMES={geen:[],ding:[[1046,0,.35,'sine']],dubbel:[[784,0,.18,'sine'],[1046,.17,.3,'sine']],
  gong:[[523,0,.9,'sine'],[659,0,.9,'sine'],[784,0,.9,'sine']],tonen:[[660,0,.14,'triangle'],[880,.13,.14,'triangle'],[1100,.26,.25,'triangle']],klik:[[2000,0,.03,'square']]};
function playChime(name){const c=CHIMES[name||settings.chime]||[];if(!c.length)return 0;
  try{AC=AC||new AudioContext();AC.resume?.();const t0=AC.currentTime+.02;
    c.forEach(([f,st,du,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(.0001,t0+st);g.gain.exponentialRampToValueAtTime(.35*(+settings.vol||1),t0+st+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+st+du);o.start(t0+st);o.stop(t0+st+du+.02)});
  }catch(e){}return Math.max(...c.map(x=>x[1]+x[2]))*1000}
function instr(t){const ms=playChime();if(ms&&settings.voice){clearTimeout(S.sayT);S.sayT=setTimeout(()=>say(t),Math.min(ms,500)+80)}else say(t)}

function navTick(){
  const p=S.pos,sh=S.shape;if(sh.length<2)return;
  let best={d:1e9,i:S.idx,t:0,q:null};
  const a=Math.max(0,S.idx-3),b=Math.min(sh.length-1,S.idx+300);
  for(let i=a;i<b;i++){const r=proj(p,sh[i],sh[i+1]);if(r.d<best.d)best={d:r.d,i,t:r.t,q:r.q}}
  if(best.d>50)for(let i=0;i<sh.length-1;i++){const r=proj(p,sh[i],sh[i+1]);if(r.d<best.d)best={d:r.d,i,t:r.t,q:r.q}}

  const road=S.limits[best.i]||0,max=road?Math.min(road,plateMax()):plateMax();
  $('limit').textContent=road||'';$('limit').classList.toggle('hide',!road);
  const over=S.speed>max+2;$('spdNow').classList.toggle('over',over);
  if(over&&settings.beep&&Date.now()-(S.lastBeep||0)>20000){S.lastBeep=Date.now();beep()}

  if(best.d>Math.max(35,S.acc*1.5)){
    S.off++;if(S.off>=3&&!S.busy&&Date.now()-S.lastReroute>12000)reroute(false);
    return;
  }
  S.off=0;S.idx=best.i;
  if(S.acc<60&&best.q){S.snap=best.q;meMarker.setLngLat([best.q[1],best.q[0]]);
    if(S.speed>4){S.heading=bearing(sh[best.i],sh[best.i+1]);meMarker.setRotation(S.heading)}}

  const along=S.cum[best.i]+best.t*(S.cum[best.i+1]-S.cum[best.i]);S.along=along;
  const total=S.cum[S.cum.length-1],remain=Math.max(0,total-along);
  let mi=S.man.findIndex(m=>m.begin_shape_index>best.i);if(mi<0)mi=S.man.length-1;S.mi=mi;
  const m=S.man[mi],dTo=Math.max(0,S.cum[Math.min(m.begin_shape_index,S.cum.length-1)]-along);S.dTo=dTo;
  let tRem=0;for(let j=mi;j<S.man.length;j++)tRem+=S.man[j].time||0;
  const cur=S.man[mi-1];if(cur&&cur.length>0)tRem+=cur.time*Math.min(1,dTo/(cur.length*1000));
  // aankomsttijd bijstellen op je echte tempo (laatste 30 s – 5 min)
  const now=Date.now(),sm=S.etaS||(S.etaS=[]);sm.push({t:now,pr:tRem});while(sm.length&&now-sm[0].t>300000)sm.shift();
  const s0=sm[0],el=(now-s0.t)/1000,pd=s0.pr-tRem;
  if(el>=30&&pd>15){const f=Math.max(0.7,Math.min(2.5,el/pd));S.etaF=S.etaF*0.9+f*0.1}
  tRem*=S.etaF;

  const isDest=m.type>=4&&m.type<=6,isFinal=isDest&&mi===S.man.length-1,isVia=isDest&&!m.lastLeg;
  $('iIcon').innerHTML=arrowSVG(m.type);
  $('iDist').textContent=fmtD(dTo);
  const names=m.street_names?.length?m.street_names.join(' / '):(m.begin_street_names?.join(' / ')||'');
  $('iStreet').textContent=isFinal?S.destName:isVia?'Tussenstop':(names||m.instruction);
  $('iSub').textContent=isFinal?'Bestemming':isVia?(S.vias[0]?.name||''):(names?m.instruction:'');
  const nx=S.man[mi+1];
  if(nx&&!isDest&&(S.cum[Math.min(nx.begin_shape_index,S.cum.length-1)]-S.cum[Math.min(m.begin_shape_index,S.cum.length-1)])<150){$('iThenIcon').innerHTML=arrowSVG(nx.type);$('iThen').classList.remove('hide')}
  else $('iThen').classList.add('hide');

  const cs=cur?.street_names?.join(' / ')||'';
  $('curStreet').textContent=cs;$('curStreet').classList.toggle('hide',!cs);
  $('sEta').textContent=clock(tRem);
  $('sTime').textContent=fmtT(tRem);
  $('sDist').textContent=fmtD(remain);
  $('progFill').style.height=(total?100*along/total:0).toFixed(1)+'%';

  if(map.getSource('route')){
    const cut=best.q?[best.q[1],best.q[0]]:[p[1],p[0]];
    map.getSource('done').setData(line([...toLngLat(sh.slice(0,best.i+1)),cut]));
    map.getSource('route').setData(line([cut,...toLngLat(sh.slice(best.i+1))]));
  }

  const wm=WARN[settings.warn]||1;
  if(settings.cams&&S.cams.length){const c=S.cams.find(c=>c.along>along-5);
    if(c){const d=c.along-along,show=d<400*wm;$('camWarn').classList.toggle('hide',!show);
      if(show)$('camWarn').textContent='📷 Flitspaal '+fmtD(d)+(c.max?' · '+c.max+' km/u':'');
      const an=S.camAnn[c.id]||(S.camAnn[c.id]={});if(!an.f&&d<300*wm){an.f=1;instr('Let op, flitspaal over '+sayD(d))}}
    else $('camWarn').classList.add('hide');
  }else $('camWarn').classList.add('hide');

  const far=(settings.type==='snor'?150:300)*wm,near=(settings.type==='snor'?30:45)*Math.min(wm,1.3);
  const an=S.announced[mi]||(S.announced[mi]={});
  if(!an.far&&dTo<=far&&dTo>near*2.5){an.far=1;instr(`Over ${sayD(dTo)}, ${lc(m.verbal_transition_alert_instruction||m.instruction)}`)}
  if(!an.near&&dTo<=near){an.near=1;an.far=1;instr(m.verbal_pre_transition_instruction||m.instruction)}

  if(isVia&&dTo<25&&!an.via){an.via=1;const v=S.vias.shift();toast('📍 Tussenstop bereikt'+(v?': '+v.name:''),3000);
    store('sn_active',{dest:S.dest,name:S.destName,vias:S.vias,t:Date.now()})}
  if(remain<25||(isFinal&&dTo<20)){
    instr('Je bent op je bestemming');toast('🏁 Bestemming bereikt',3500);stopNav();
  }
}
async function reroute(force){
  if(!navigator.onLine){if(force||Date.now()-S.lastReroute>30000){S.lastReroute=Date.now();toast(force?'Geen internet – route kan niet worden aangepast':'Geen internet – keer terug naar de blauwe route',3000)}return}
  if(S.busy)return;
  S.busy=true;S.lastReroute=Date.now();toast('Route herberekenen…',1500);
  try{const rs=await fetchRoutes(S.pos,true,false);if(S.navigating){S.routes=[rs[0]];S.sel=0;applyRoute(rs[0]);S.announced[0]={far:1,near:1};say('Route aangepast')}}
  catch(e){toast('Herberekenen mislukt')}
  S.busy=false;
}

  openSheet(title,'<div class="li">Zoeken…</div>',back);
  const[la,lo]=S.pos,q=`[out:json][timeout:20];(node${p[2]}(around:${p[3]},${la},${lo});way${p[2]}(around:${p[3]},${la},${lo}););out center 60;`;
  try{const j=await(await fetch(OVERPASS,{method:'POST',body:q})).json();
    const list=(j.elements||[]).map(e=>{const ll=e.lat!=null?[e.lat,e.lon]:(e.center?[e.center.lat,e.center.lon]:null);if(!ll)return null;const t=e.tags||{};

async function downloadArea(kind,center,silent){
  if(S.dl){if(!silent)toast('Download is al bezig');return false}
  const tpl=map.getSource('openmaptiles')?.tiles?.[0];if(!tpl){if(!silent)toast('Kaart is nog niet geladen');return false}
  if(!navigator.onLine){if(!silent)toast('Geen internet');return false}
  const keys=new Set();
  if(kind==='route'){for(const z of[10,11,12,13,14])for(const[la,lo]of S.shape){const[x,y]=tileXY(la,lo,z);for(const dx of[-1,0,1])for(const dy of[-1,0,1])keys.add(z+'/'+(x+dx)+'/'+(y+dy))}}
  else{const c=center||S.pos||[map.getCenter().lat,map.getCenter().lng],dLa=kind/111,dLo=kind/(111*Math.cos(rad(c[0])));
    for(const z of[8,9,10,11,12,13,14]){const[x1,y1]=tileXY(c[0]+dLa,c[1]-dLo,z),[x2,y2]=tileXY(c[0]-dLa,c[1]+dLo,z);
      for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)keys.add(z+'/'+x+'/'+y)}}
  const urls=[...keys].map(k=>{const[z,x,y]=k.split('/');return tpl.replace('{z}',z).replace('{x}',x).replace('{y}',y)});
  const st=map.getStyle(),fonts=new Set();
  (st.layers||[]).forEach(l=>{const f=l.layout&&l.layout['text-font'];if(Array.isArray(f)&&f.length&&f.every(x=>typeof x==='string'))fonts.add(f.join(','))});
  if(typeof st.glyphs==='string')fonts.forEach(f=>['0-255','256-511','8192-8447'].forEach(r=>urls.push(st.glyphs.replace('{fontstack}',f).replace('{range}',r))));
  const sp=Array.isArray(st.sprite)?st.sprite.map(s=>s.url):(st.sprite?[st.sprite]:[]);
  sp.forEach(b=>['.json','.png','@2x.json','@2x.png'].forEach(x=>urls.push(b+x)));
  ['liberty','fiord'].forEach(n=>urls.push('https://tiles.openfreemap.org/styles/'+n));
  try{await navigator.storage?.persist?.()}catch(e){}
  S.dl=true;let done=0,fail=0,i=0;
  const prog=()=>{const el=$('dlProg');if(el)el.textContent=`Downloaden… ${done} / ${urls.length}`};prog();
  const w=async()=>{while(i<urls.length&&S.dl){const u=urls[i++];try{const r=await fetch(u);if(!r.ok)fail++}catch(e){fail++}done++;if(done%10===0)prog()}};
  await Promise.all((silent?[1,2,3]:[1,2,3,4,5,6]).map(w));
  const stopped=done<urls.length;S.dl=false;
  const el=$('dlProg');if(el)el.textContent=stopped?`Gestopt na ${done} van ${urls.length} onderdelen`:`Klaar ✔ ${done-fail} onderdelen opgeslagen${fail?` (${fail} mislukt)`:''}`;
  if(!silent)toast(stopped?'Download gestopt':'Kaart offline opgeslagen ✔');
  return !stopped&&fail<urls.length*0.1;
}
async function autoOffline(){ // 1x per week, op wifi, 25 km rond Thuis (of je locatie)
  if(!settings.autoDl||!navigator.onLine||S.navigating)return;
  if(Date.now()-(+load('sn_autoDl',0))<7*864e5)return;
  const ct=navigator.connection;if(ct&&(ct.type==='cellular'||ct.saveData))return;
  const home=places.find(p=>p.name==='Thuis'),c=home?home.ll:S.pos;if(!c)return;
  S.autoTried=true;
  if(await downloadArea(25,c,true)){store('sn_autoDl',Date.now());toast('Kaart rond '+(home?'huis':'je locatie')+' offline bijgewerkt ✔',2500)}
}
function openAbout(back){openSheet('Over deze app',`<div style="font-size:14px;line-height:1.5;color:#c9d1d9;padding-top:8px">
  <b>Scooter Navigatie</b><br>Kaart: OpenFreeMap / © OpenStreetMap-bijdragers<br>Routes & maximumsnelheden: Valhalla (FOSSGIS)<br>Adressen: Photon (Komoot)<br>Flitspalen & plekken: OpenStreetMap via Overpass<br>Weer: Open-Meteo<br><br>
  Alle gegevens komen uit open, gratis bronnen. Verkeersborden en de wet gaan altijd voor de app.</div>`,back)}

/* ---------- dialoog ---------- */
function openPrompt(title,val,cb,type='text'){$('dlgTitle').textContent=title;const i=$('dlgIn');i.type=type;i.value=val??'';
  $('dlg').classList.remove('hide');setTimeout(()=>{i.focus();try{i.select()}catch(e){}},50);
  $('dlgOk').onclick=()=>{$('dlg').classList.add('hide');cb(i.value.trim())};
  $('dlgNo').onclick=()=>$('dlg').classList.add('hide')}
$('dlgIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('dlgOk').click()});

/* ---------- overig ---------- */
addEventListener('deviceorientationabsolute',e=>{
  if(e.alpha==null||S.speed>4||Date.now()-(S.lastComp||0)<250)return;S.lastComp=Date.now();
  const hd=(360-e.alpha+(screen.orientation?.angle||0))%360;S.heading=(S.heading+angDiff(S.heading,hd)*0.3+360)%360;if(meAdded)meMarker.setRotation(S.heading)});
setInterval(()=>{
  if(!S.autoTried&&map.getSource('openmaptiles')?.tiles&&(S.pos||places.some(p=>p.name==='Thuis')))autoOffline();
  if(S.lastFix&&Date.now()-S.lastFix>10000){const ga=$('gpsAcc');ga.textContent='GPS-signaal kwijt';ga.classList.add('bad')}
  if(settings.theme==='auto')applyTheme();
},5000);
addEventListener('popstate',()=>{
  if(!$('sheet').classList.contains('hide')){closeSheet();if(S.navigating)history.pushState({nav:1},'');return}
  if(!S.navigating)return;
  if(Date.now()-(S.backT||0)<2500){stopNav();return}
  S.backT=Date.now();toast('Druk nogmaals op terug om de navigatie te stoppen');history.pushState({nav:1},'')});
function netState(){$('offline').classList.toggle('hide',navigator.onLine)}
addEventListener('online',netState);addEventListener('offline',netState);netState();
if('speechSynthesis' in window)speechSynthesis.getVoices();
applyBright();renderChips();navLabels();checkService();
setTimeout(()=>{if(!S.lastFix)toast('Geen locatie ontvangen. Sta Locatie (precies) toe voor deze app in je Android-instellingen.',8000)},8000);

const act=load('sn_active',null);
if(act&&act.dest&&Date.now()-act.t<6*3600e3){$('rsTxt').textContent='Navigatie naar '+act.name+' hervatten?';$('resume').classList.remove('hide')}
$('rsNo').onclick=()=>{store('sn_active',null);$('resume').classList.add('hide')};
$('rsYes').onclick=()=>{$('resume').classList.add('hide');S.autoStart=true;try{AC=AC||new AudioContext()}catch(e){}$('q').value=act.name;setDest(act.dest,act.name,act.vias||[])};
const go=new URLSearchParams(location.search).get('go');
if(go){const pl=places.find(p=>p.name===go);history.replaceState(null,'',location.pathname);
  if(pl){$('resume').classList.add('hide');S.autoStart=true;$('q').value=pl.name;setDest(pl.ll,pl.name)}
  else setTimeout(()=>toast('Stel eerst '+go+' in via ☰ → Thuis & Werk',4000),800)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
