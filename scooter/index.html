<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scooter Navigatie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1216;color:#fff;overflow:hidden;user-select:none}
#map{position:fixed;inset:0}
.hide{display:none!important}
.card{background:#1b2027;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
/* zoeken */
#top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:10}
#qwrap{display:flex;align-items:center;padding:4px 6px 4px 14px}
#q{flex:1;background:none;border:0;color:#fff;font-size:17px;padding:12px 4px;outline:none}
#q::placeholder{color:#8b949e}
#qclear{background:none;border:0;color:#8b949e;font-size:22px;padding:8px 10px}
#sug{margin-top:6px;max-height:55vh;overflow:auto}
.si{padding:13px 16px;border-bottom:1px solid #2b323b;font-size:15px}
.si:last-child{border:0}.si small{color:#8b949e;display:block;margin-top:2px}
/* route-preview */
#preview{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;padding:16px}
#pvName{font-size:18px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pvSum{color:#c9d1d9;font-size:15px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:10px}
.seg{flex:1;display:flex;background:#0d1117;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:#8b949e;padding:9px 4px;border-radius:8px;font-size:14px}
.seg button.on{background:#2f81f7;color:#fff;font-weight:600}
.tog{border:0;background:#0d1117;color:#8b949e;padding:9px 12px;border-radius:10px;font-size:14px}
.tog.on{background:#238636;color:#fff}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;color:#fff;background:#30363d}
.btn.go{background:#2f81f7;flex:1;font-size:18px}
/* TomTom-achtige navigatie */
#instr{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:10;display:flex;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#iArrow{width:104px;background:#0b57d0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px}
#iArrow svg{width:64px;height:64px}
#iDist{font-size:24px;font-weight:800;margin-top:2px;white-space:nowrap}
#iMain{flex:1;min-width:0;background:#1b2027;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
#iStreet{font-size:22px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#iSub{font-size:14px;color:#9aa4ae;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#iThen{position:fixed;top:calc(126px + env(safe-area-inset-top));left:10px;z-index:9;background:#08408f;border-radius:0 0 12px 12px;padding:5px 12px 6px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
#iThen svg{width:22px;height:22px}
#prog{position:fixed;right:10px;top:calc(150px + env(safe-area-inset-top));bottom:calc(150px + env(safe-area-inset-bottom));width:10px;background:rgba(0,0,0,.45);border-radius:6px;z-index:9;overflow:hidden}
#progFill{position:absolute;left:0;right:0;bottom:0;background:#4c9aff;border-radius:6px}
#curStreet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));z-index:9;background:rgba(15,18,22,.85);padding:6px 14px;border-radius:10px;font-size:15px;font-weight:600;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#1b2027;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;box-shadow:0 -4px 20px rgba(0,0,0,.45)}
#spdBox{display:flex;align-items:center;gap:6px}
#spdNow{width:64px;height:64px;border-radius:14px;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .3s}
#spdNow b{font-size:28px}#spdNow small{font-size:10px;color:#9aa4ae;margin-top:2px}
#spdNow.over{background:#da3633}#spdNow.over small{color:#fff}
#limit{width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid #d1242f;color:#111;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.stat{flex:1;text-align:center;line-height:1.1}
.stat b{display:block;font-size:22px;font-weight:800}
.stat small{font-size:11px;color:#9aa4ae;text-transform:uppercase;letter-spacing:.04em}
#menuBtn{width:46px;height:46px;border-radius:12px;border:0;background:#30363d;color:#fff;font-size:22px}
#navMenu{position:fixed;right:10px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:11;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:200px}
#navMenu button{border:0;background:#262c34;color:#fff;font-size:16px;padding:14px;border-radius:10px;text-align:left}
#navMenu button.stop{background:#da3633}
/* algemeen */
#speedIdle{position:fixed;left:14px;z-index:9;width:62px;height:62px;border-radius:50%;background:#fff;color:#111;border:4px solid #30363d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1;bottom:calc(24px + env(safe-area-inset-bottom))}
#speedIdle small{font-size:10px;font-weight:600}
#recenter{position:fixed;right:14px;z-index:9;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:#1b2027;color:#58a6ff;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4)}
body.nav #recenter{bottom:calc(150px + env(safe-area-inset-bottom));right:28px}
body.preview #recenter,body.preview #speedIdle{display:none}
#themeBtn{position:fixed;right:14px;top:calc(80px + env(safe-area-inset-top));z-index:9;width:48px;height:48px;border-radius:50%;border:0;background:#1b2027;color:#fff;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
body.nav #themeBtn,body.preview #themeBtn{display:none}
#gpsAcc{position:fixed;left:14px;z-index:9;bottom:calc(94px + env(safe-area-inset-bottom));background:rgba(15,18,22,.85);padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600}
#gpsAcc.bad{background:#9a6700}
body.nav #gpsAcc{bottom:calc(98px + env(safe-area-inset-bottom));left:auto;right:28px}
body.preview #gpsAcc{display:none}
#map canvas{filter:brightness(var(--br,1))}
#mapPanel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:15;padding:16px}
#brRange{width:100%;accent-color:#2f81f7;height:32px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:42%;z-index:20;background:rgba(0,0,0,.85);padding:12px 18px;border-radius:12px;font-size:15px;max-width:85vw;text-align:center}
#dlg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
#dlg .card{width:100%;max-width:380px;padding:18px}
#dlg input{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#fff;margin:10px 0 14px;outline:none}
.me{width:46px;height:46px}
#offline{position:fixed;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:12;background:#9a6700;padding:5px 12px;border-radius:10px;font-size:13px;font-weight:600}
body.nav #offline{top:auto;bottom:calc(140px + env(safe-area-inset-bottom))}
.maplibregl-ctrl-attrib{font-size:10px}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="qwrap" class="card">
    <span style="font-size:18px">🛵</span>
    <input id="q" placeholder="Waar wil je heen?" autocomplete="off" enterkeyhint="search">
    <button id="qclear" class="hide">✕</button>
  </div>
  <div id="sug" class="card hide"></div>
</div>

<div id="preview" class="card hide">
  <div id="pvName"></div>
  <div id="pvSum">Route berekenen…</div>
  <div class="row">
    <div class="seg" id="segType">
      <button data-v="snor">🟦 Blauw · 25</button>
      <button data-v="brom">🟨 Geel · 45</button>
    </div>
    <button class="tog" id="togQuiet">Rustig</button>
  </div>
  <div class="row" style="margin:0">
    <button class="btn" id="pvClose">✕</button>
    <button class="btn" id="pvSave">★</button>
    <button class="btn go" id="pvGo">Start</button>
  </div>
</div>

<!-- navigatiescherm -->
<div id="instr" class="hide">
  <div id="iArrow"><div id="iIcon"></div><div id="iDist">–</div></div>
  <div id="iMain"><div id="iStreet"></div><div id="iSub"></div></div>
</div>
<div id="iThen" class="hide"><span>Daarna</span><span id="iThenIcon"></span></div>
<div id="prog" class="hide"><div id="progFill"></div></div>
<div id="curStreet" class="hide"></div>
<div id="bar" class="hide">
  <div id="spdBox">
    <div id="spdNow"><b id="spd">0</b><small>km/u</small></div>
    <div id="limit">25</div>
  </div>
  <div class="stat"><b id="sEta">--:--</b><small>Aankomst</small></div>
  <div class="stat"><b id="sTime">–</b><small>Reistijd</small></div>
  <div class="stat"><b id="sDist">–</b><small>Afstand</small></div>
  <button id="menuBtn">⋮</button>
</div>
<div id="navMenu" class="card hide">
  <button id="mTheme"></button>
  <button id="mVoice">🔊 Stem aan</button>
  <button id="mOver">🗺 Route-overzicht</button>
  <button id="mStop" class="stop">✕ Navigatie stoppen</button>
</div>

<div id="gpsAcc" class="hide"></div>
<div id="speedIdle"><span id="spdIdle">0</span><small>km/u</small></div>
<button id="recenter" class="hide">⌖</button>
<button id="themeBtn"></button>
<div id="toast" class="hide"></div>
<div id="mapPanel" class="card hide">
  <div style="font-weight:600;margin-bottom:10px">Kaart</div>
  <div class="seg" id="segTheme"><button data-v="auto">🌓 Auto</button><button data-v="day">☀️ Dag</button><button data-v="night">🌙 Nacht</button></div>
  <div style="display:flex;justify-content:space-between;margin:16px 0 6px;font-size:14px;color:#c9d1d9"><span>Helderheid</span><span id="brVal"></span></div>
  <input type="range" id="brRange" min="30" max="130" step="5">
  <button class="btn go" id="mpClose" style="width:100%;margin-top:14px">Klaar</button>
</div>
<div id="offline" class="hide">Offline – route gaat door, zoeken kan niet</div>
<div id="dlg" class="hide"><div class="card">
  <div style="font-size:17px;font-weight:600">Bewaar als favoriet</div>
  <input id="dlgIn" placeholder="Bijv. Thuis, Werk">
  <div class="row" style="margin:0"><button class="btn" id="dlgNo" style="flex:1">Annuleer</button><button class="btn go" id="dlgOk">Bewaar</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const settings=Object.assign({type:'snor',quiet:false,voice:true,theme:'auto',bright:100},load('sn_set',{}));
let places=load('sn_places',[]);
const S={pos:null,acc:0,heading:0,speed:0,dest:null,destName:'',shape:[],cum:[],man:[],sum:null,limits:[],
  navigating:false,follow:true,idx:0,off:0,lastReroute:0,announced:{},wake:null,busy:false,firstFix:false};
const VALHALLA='https://valhalla1.openstreetmap.de';
const plateMax=()=>settings.type==='snor'?25:45;

/* ---------- kaart (OpenFreeMap vectorkaart, gratis) ---------- */
function styleUrl(){const h=new Date().getHours();const n=settings.theme==='night'||(settings.theme==='auto'&&(h>=18||h<7));
  return 'https://tiles.openfreemap.org/styles/'+(n?'fiord':'liberty')}
const map=new maplibregl.Map({container:'map',
  style:styleUrl(),
  center:[6.118,51.862],zoom:14,attributionControl:{compact:true},pitchWithRotate:true});
function ensureLayers(){
  if(!map.isStyleLoaded()||map.getSource('route'))return;
  map.addSource('route',{type:'geojson',data:emptyLine()});
  map.addSource('done',{type:'geojson',data:emptyLine()});
  map.addLayer({id:'done-line',type:'line',source:'done',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#8a939c','line-width':['interpolate',['linear'],['zoom'],12,4,18,14],'line-opacity':.7}});
  map.addLayer({id:'route-case',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#08306b','line-width':['interpolate',['linear'],['zoom'],12,7,18,22]}});
  map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#3d8bff','line-width':['interpolate',['linear'],['zoom'],12,4,18,15]}});
  if(S.shape.length)drawRoute();
}
map.on('style.load',ensureLayers);map.on('styledata',ensureLayers);map.on('idle',ensureLayers);
const emptyLine=()=>({type:'Feature',geometry:{type:'LineString',coordinates:[]}});
const toLngLat=a=>a.map(p=>[p[1],p[0]]);

const meEl=document.createElement('div');meEl.className='me';
meEl.innerHTML='<svg viewBox="0 0 46 46" width="46" height="46"><path d="M23 3 L40 40 L23 31 L6 40 Z" fill="#3d8bff" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/></svg>';
const meMarker=new maplibregl.Marker({element:meEl,rotationAlignment:'map',pitchAlignment:'map'});
let meAdded=false,destMarker=null;

function stopFollow(){if(!S.follow)return;S.follow=false;$('recenter').classList.remove('hide')}
['dragstart','rotatestart','pitchstart'].forEach(ev=>map.on(ev,e=>{if(e.originalEvent)stopFollow()}));
map.on('zoomstart',e=>{if(e.originalEvent&&!S.navigating)stopFollow()});
$('recenter').onclick=()=>{S.follow=true;$('recenter').classList.add('hide');camera(true)};

// lang drukken op kaart = bestemming kiezen
let lpT,lpStart;
map.getCanvas().addEventListener('touchstart',e=>{if(S.navigating||e.touches.length>1){clearTimeout(lpT);return}
  const t=e.touches[0];lpStart=[t.clientX,t.clientY];
  lpT=setTimeout(()=>{const r=map.getCanvas().getBoundingClientRect();const ll=map.unproject([lpStart[0]-r.left,lpStart[1]-r.top]);
    navigator.vibrate?.(30);setDest([ll.lat,ll.lng],'Gekozen punt op kaart')},650)},{passive:true});
map.getCanvas().addEventListener('touchmove',e=>{const t=e.touches[0];if(lpStart&&Math.hypot(t.clientX-lpStart[0],t.clientY-lpStart[1])>10)clearTimeout(lpT)},{passive:true});
map.getCanvas().addEventListener('touchend',()=>clearTimeout(lpT));
map.on('contextmenu',e=>{if(!S.navigating)setDest([e.lngLat.lat,e.lngLat.lng],'Gekozen punt op kaart')});

/* ---------- geo-hulp ---------- */
const R=6371000,rad=x=>x*Math.PI/180;
function dist(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);const q=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(Math.atan2(y,x)*180/Math.PI+360)%360}
function proj(p,a,b){const k=Math.cos(rad(p[0]));const ax=a[1]*k,ay=a[0],dx=b[1]*k-ax,dy=b[0]-ay;const L2=dx*dx+dy*dy;
  let t=L2?((p[1]*k-ax)*dx+(p[0]-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return{d:dist(p,[ay+t*dy,(ax+t*dx)/k]),t}}
function decode(s,prec=6){let i=0,la=0,lo=0,o=[],f=10**prec;while(i<s.length){for(const w of[0,1]){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const v=(r&1)?~(r>>1):(r>>1);if(w)lo+=v;else la+=v}o.push([la/f,lo/f])}return o}
function fmtD(m){return m<1000?(m<100?Math.round(m/5)*5:Math.round(m/10)*10)+' m':(m/1000).toFixed(m<10000?1:0).replace('.',',')+' km'}
function sayD(m){return m<1000?Math.max(50,Math.round(m/50)*50)+' meter':(m/1000).toFixed(1).replace('.',',').replace(',0','')+' kilometer'}
function fmtT(s){const m=Math.max(0,Math.round(s/60));return m<60?m+' min':Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' u'}
function clock(s){return new Date(Date.now()+s*1000).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}
function toast(t,ms=2500){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hide'),ms)}
function angDiff(a,b){return((b-a+540)%360)-180}

/* ---------- GPS ---------- */
if('geolocation' in navigator){
  navigator.geolocation.watchPosition(onPos,err=>toast(err.code===1?'Geef toestemming voor je locatie in de browser':'Geen GPS-signaal',4000),
    {enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}else toast('Deze browser ondersteunt geen locatie');

function onPos(p){
  const c=p.coords,ll=[c.latitude,c.longitude];
  if(S.pos){const d=dist(S.pos,ll);
    let hd=null;
    if(c.heading!=null&&!isNaN(c.heading)&&(c.speed||0)>1.5)hd=c.heading;else if(d>5)hd=bearing(S.pos,ll);
    if(hd!=null)S.heading=(S.heading+angDiff(S.heading,hd)*0.6+360)%360;}
  if(c.speed!=null&&!isNaN(c.speed))S.speed=Math.max(0,c.speed*3.6);
  S.pos=ll;S.acc=c.accuracy||0;
  const ga=$('gpsAcc');ga.textContent='GPS ±'+Math.round(S.acc)+' m';ga.classList.remove('hide');ga.classList.toggle('bad',S.acc>30);
  if(S.acc>500&&!S.warnedAcc){S.warnedAcc=1;toast('Locatie is onnauwkeurig: zet "Precieze locatie" aan voor Chrome',5000)}
  const sp=Math.round(S.speed);$('spd').textContent=sp;$('spdIdle').textContent=sp;
  meMarker.setLngLat([ll[1],ll[0]]).setRotation(S.heading);
  if(!meAdded){meMarker.addTo(map);meAdded=true}
  if(!S.firstFix){S.firstFix=true;map.jumpTo({center:[ll[1],ll[0]],zoom:16})}
  else if(S.follow)camera(false);
  if(S.navigating)navTick();
}
function camera(instant){
  if(!S.pos)return;
  const c=[S.pos[1],S.pos[0]];
  if(S.navigating){
    const z=S.speed<12?17.6:S.speed<30?17.1:16.6;
    map.easeTo({center:c,bearing:S.heading,pitch:58,zoom:z,duration:instant?600:950,easing:t=>t,
      padding:{top:Math.round(innerHeight*0.42),bottom:90,left:0,right:0}});
  }else map.easeTo({center:c,duration:instant?500:900,padding:{top:0,bottom:0,left:0,right:0}});
}

/* ---------- zoeken (Photon / OpenStreetMap) ---------- */
let sT;
$('q').addEventListener('input',e=>{const v=e.target.value.trim();$('qclear').classList.toggle('hide',!v);clearTimeout(sT);
  if(v.length<3){showPlaces();return}sT=setTimeout(()=>search(v),350)});
$('q').addEventListener('focus',()=>{if($('q').value.trim().length<3)showPlaces()});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('sug').querySelector('.si[data-ok]');if(f)f.click()}});
$('qclear').onclick=()=>{$('q').value='';$('qclear').classList.add('hide');showPlaces();$('q').focus()};
map.on('click',()=>{$('sug').classList.add('hide');$('q').blur();$('navMenu').classList.add('hide')});

function showPlaces(){
  if(!places.length){$('sug').classList.add('hide');return}
  renderSug(places.map(p=>({name:'★ '+p.name,sub:p.sub||'',ll:p.ll,raw:p.name,fav:true})));
}
async function search(v){
  const c=S.pos||[map.getCenter().lat,map.getCenter().lng];
  try{const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(v)}&limit=7&lat=${c[0]}&lon=${c[1]}`);
    const j=await r.json();
    renderSug(j.features.map(f=>{const p=f.properties;
      const st=p.street?(p.street+(p.housenumber?' '+p.housenumber:'')):'';
      const main=p.name||st;
      const sub=[p.name&&st?st:'',p.postcode,p.city||p.town||p.village||p.county].filter(Boolean).join(', ');
      const ll=[f.geometry.coordinates[1],f.geometry.coordinates[0]];
      return{name:main||sub,sub:(main?sub:'')+(S.pos?' · '+fmtD(dist(S.pos,ll)):''),ll,raw:main||sub}}));
  }catch(e){toast('Zoeken mislukt – controleer je internet')}
}
function renderSug(list){
  const el=$('sug');el.innerHTML='';
  if(!list.length){el.innerHTML='<div class="si">Niets gevonden</div>';el.classList.remove('hide');return}
  list.forEach(it=>{const d=document.createElement('div');d.className='si';d.dataset.ok=1;
    d.innerHTML=`${esc(it.name)}${it.sub?`<small>${esc(it.sub)}</small>`:''}`;
    d.onclick=()=>{el.classList.add('hide');$('q').blur();$('q').value=it.raw;$('qclear').classList.remove('hide');setDest(it.ll,it.raw)};
    if(it.fav){let lt;d.addEventListener('touchstart',()=>{lt=setTimeout(()=>{d.onclick=null;
        places=places.filter(p=>p.name!==it.raw);store('sn_places',places);toast(`"${it.raw}" verwijderd`);showPlaces()},800)},{passive:true});
      d.addEventListener('touchend',()=>clearTimeout(lt));d.addEventListener('touchmove',()=>clearTimeout(lt),{passive:true})}
    el.appendChild(d)});
  el.classList.remove('hide');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- route (Valhalla, scooterprofiel) ---------- */
async function post(path,body){ // tekst-body = geen CORS-preflight
  const r=await fetch(VALHALLA+path,{method:'POST',body:JSON.stringify(body)});return r.json()}
async function fetchRoute(from,to,useHeading){
  const loc0={lat:from[0],lon:from[1]};
  if(useHeading&&S.speed>8){loc0.heading=Math.round(S.heading);loc0.heading_tolerance=60}
  const j=await post('/route',{locations:[loc0,{lat:to[0],lon:to[1]}],costing:'motor_scooter',
    costing_options:{motor_scooter:{top_speed:plateMax(),use_primary:settings.quiet?0.1:0.5,use_hills:0.5}},
    directions_options:{language:'nl-NL',units:'kilometers'}});
  if(!j.trip)throw new Error(j.error||'Geen route gevonden');
  const leg=j.trip.legs[0],shape=decode(leg.shape),cum=[0];
  for(let i=1;i<shape.length;i++)cum.push(cum[i-1]+dist(shape[i-1],shape[i]));
  return{shape,cum,man:leg.maneuvers,sum:j.trip.summary,enc:leg.shape};
}
async function fetchLimits(enc,n){ // maximumsnelheden langs de route (uit OpenStreetMap)
  const lim=new Array(n).fill(0);
  try{const j=await post('/trace_attributes',{encoded_polyline:enc,shape_match:'edge_walk',costing:'motor_scooter',
      filters:{attributes:['edge.speed_limit','edge.begin_shape_index','edge.end_shape_index'],action:'include'}});
    (j.edges||[]).forEach(e=>{const v=typeof e.speed_limit==='number'?e.speed_limit:0;
      for(let i=e.begin_shape_index;i<=e.end_shape_index&&i<n;i++)lim[i]=v});
  }catch(e){}
  return lim;
}
function applyRoute(rt){
  Object.assign(S,rt);S.idx=0;S.off=0;S.announced={};S.limits=[];
  drawRoute();
  fetchLimits(rt.enc,rt.shape.length).then(l=>{if(S.enc===rt.enc)S.limits=l});
  prefetchTiles(rt.shape);
}
function prefetchTiles(shape){ // kaart langs de route alvast opslaan voor offline
  const tpl=map.getSource('openmaptiles')?.tiles?.[0];if(!tpl)return;
  const set=new Set();
  for(const z of[12,13,14]){const n=2**z;
    for(const[la,lo]of shape){const x=Math.floor((lo+180)/360*n),y=Math.floor((1-Math.log(Math.tan(rad(la))+1/Math.cos(rad(la)))/Math.PI)/2*n);
      for(const dx of[-1,0,1])for(const dy of[-1,0,1])set.add(z+'/'+(x+dx)+'/'+(y+dy))}}
  const urls=[...set].map(k=>{const[z,x,y]=k.split('/');return tpl.replace('{z}',z).replace('{x}',x).replace('{y}',y)});
  let i=0;const w=async()=>{while(i<urls.length){try{await fetch(urls[i++])}catch(e){}}};for(let k=0;k<4;k++)w();
}
function drawRoute(){
  ensureLayers();
  if(!map.getSource('route'))return;
  map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:toLngLat(S.shape)}});
  map.getSource('done').setData(emptyLine());
}
async function setDest(ll,name){
  S.dest=ll;S.destName=name;
  if(!destMarker)destMarker=new maplibregl.Marker({color:'#d1242f'});
  destMarker.setLngLat([ll[1],ll[0]]).addTo(map);
  document.body.classList.add('preview');
  $('pvName').textContent=name;$('preview').classList.remove('hide');$('recenter').classList.add('hide');
  syncToggles();await planRoute();
}
async function planRoute(){
  if(!S.pos){$('pvSum').textContent='Wachten op je GPS-locatie…';setTimeout(()=>{if(S.dest&&!S.navigating&&!$('preview').classList.contains('hide'))planRoute()},2000);return}
  $('pvSum').textContent='Route berekenen…';
  try{const rt=await fetchRoute(S.pos,S.dest,false);applyRoute(rt);
    $('pvSum').textContent=`${fmtD(rt.sum.length*1000)} · ${fmtT(rt.sum.time)} · aankomst ${clock(rt.sum.time)}`;
    S.follow=false;overview(230);
  }catch(e){$('pvSum').textContent='⚠ '+e.message}
}
function overview(bottom){
  const b=new maplibregl.LngLatBounds();S.shape.forEach(p=>b.extend([p[1],p[0]]));
  map.fitBounds(b,{padding:{top:110,bottom,left:40,right:40},bearing:0,pitch:0,duration:800});
}
function syncToggles(){
  document.querySelectorAll('#segType button').forEach(b=>b.classList.toggle('on',b.dataset.v===settings.type));
  $('togQuiet').classList.toggle('on',settings.quiet);
}
document.querySelectorAll('#segType button').forEach(b=>b.onclick=()=>{settings.type=b.dataset.v;store('sn_set',settings);syncToggles();planRoute()});
$('togQuiet').onclick=()=>{settings.quiet=!settings.quiet;store('sn_set',settings);syncToggles();planRoute()};
$('pvClose').onclick=clearRoute;
$('pvSave').onclick=()=>{$('dlgIn').value=S.destName;$('dlg').classList.remove('hide');$('dlgIn').select()};
$('dlgNo').onclick=()=>$('dlg').classList.add('hide');
$('dlgOk').onclick=()=>{const n=$('dlgIn').value.trim();if(!n)return;
  places=places.filter(p=>p.name!==n);places.unshift({name:n,ll:S.dest,sub:S.destName!==n?S.destName:''});places=places.slice(0,12);
  store('sn_places',places);$('dlg').classList.add('hide');toast('Bewaard als favoriet ★')};
$('pvGo').onclick=startNav;

function clearRoute(){
  S.dest=null;S.shape=[];$('preview').classList.add('hide');document.body.classList.remove('preview');
  if(map.getSource('route')){map.getSource('route').setData(emptyLine());map.getSource('done').setData(emptyLine())}
  destMarker?.remove();
  $('q').value='';$('qclear').classList.add('hide');
  if(S.pos){S.follow=true;map.easeTo({center:[S.pos[1],S.pos[0]],zoom:16,bearing:0,pitch:0,duration:700})}
}

/* ---------- afslagpijlen ---------- */
function arrowSVG(type){
  const W='#fff';
  if(type>=4&&type<=6)return`<svg viewBox="0 0 100 100"><path d="M30 92V12" stroke="${W}" stroke-width="9" stroke-linecap="round"/><path d="M34 14h44l-10 14 10 14H34z" fill="${W}"/></svg>`;
  if(type===12||type===13){const l=type===13;const x1=l?62:38,x2=l?32:68;
    return`<svg viewBox="0 0 100 100"><path d="M${x1} 94V44a15 15 0 0 0 ${l?'-30':'30'} 0v14" fill="none" stroke="${W}" stroke-width="13"/><polygon points="${x2-20},56 ${x2+20},56 ${x2},80" fill="${W}"/></svg>`}
  if(type===26||type===27)return`<svg viewBox="0 0 100 100"><circle cx="50" cy="54" r="20" fill="none" stroke="${W}" stroke-width="10" opacity=".55"/><path d="M50 96V74" stroke="${W}" stroke-width="12"/><path d="M64 40L80 22" stroke="${W}" stroke-width="12"/><polygon points="72,10 92,10 92,30" fill="${W}"/></svg>`;
  const A={9:45,10:90,11:135,14:-135,15:-90,16:-45,18:35,20:35,23:30,19:-35,21:-35,24:-30}[type]||0;
  const r=A*Math.PI/180,ex=50+33*Math.sin(r),ey=50-33*Math.cos(r);
  return`<svg viewBox="0 0 100 100"><path d="M50 96L50 50L${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="${W}" stroke-width="13" stroke-linejoin="round"/><polygon points="0,-22 20,6 -20,6" transform="translate(${ex.toFixed(1)} ${ey.toFixed(1)}) rotate(${A})" fill="${W}"/></svg>`;
}

/* ---------- navigeren ---------- */
function say(t){if(!settings.voice||!('speechSynthesis' in window)||!t)return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('nl'));if(v)u.voice=v;u.rate=1.05;speechSynthesis.speak(u)}
const lc=s=>s?s.charAt(0).toLowerCase()+s.slice(1):'';
function setVoiceLabel(){$('mVoice').textContent=settings.voice?'🔊 Stem aan':'🔇 Stem uit'}

async function startNav(){
  if(!S.shape.length)return;
  S.navigating=true;S.follow=true;
  document.body.classList.remove('preview');document.body.classList.add('nav');
  ['preview','top','recenter','speedIdle'].forEach(i=>$(i).classList.add('hide'));
  ['instr','bar','prog','curStreet'].forEach(i=>$(i).classList.remove('hide'));
  setVoiceLabel();
  try{S.wake=await navigator.wakeLock?.request('screen')}catch(e){}
  say(S.man[0]?.verbal_pre_transition_instruction||S.man[0]?.instruction);
  S.announced[0]={far:1,near:1};
  if(S.pos){camera(true);navTick()}
}
function stopNav(){
  S.navigating=false;window.speechSynthesis?.cancel();
  try{S.wake?.release()}catch(e){}S.wake=null;
  document.body.classList.remove('nav');
  ['instr','iThen','bar','prog','curStreet','navMenu'].forEach(i=>$(i).classList.add('hide'));
  ['top','speedIdle'].forEach(i=>$(i).classList.remove('hide'));
  clearRoute();
}
document.addEventListener('visibilitychange',async()=>{if(S.navigating&&document.visibilityState==='visible'){try{S.wake=await navigator.wakeLock?.request('screen')}catch(e){}}});
$('menuBtn').onclick=()=>$('navMenu').classList.toggle('hide');
$('mStop').onclick=stopNav;
$('mVoice').onclick=()=>{settings.voice=!settings.voice;store('sn_set',settings);setVoiceLabel();if(!settings.voice)window.speechSynthesis?.cancel()};
$('mOver').onclick=()=>{$('navMenu').classList.add('hide');S.follow=false;$('recenter').classList.remove('hide');overview(120)};

function navTick(){
  const p=S.pos,sh=S.shape;if(sh.length<2)return;
  let best={d:1e9,i:S.idx,t:0};
  const a=Math.max(0,S.idx-3),b=Math.min(sh.length-1,S.idx+300);
  for(let i=a;i<b;i++){const r=proj(p,sh[i],sh[i+1]);if(r.d<best.d)best={d:r.d,i,t:r.t}}
  if(best.d>50)for(let i=0;i<sh.length-1;i++){const r=proj(p,sh[i],sh[i+1]);if(r.d<best.d)best={d:r.d,i,t:r.t}}

  // snelheid t.o.v. maximum (kenteken én bord)
  const road=S.limits[best.i]||0,max=road?Math.min(road,plateMax()):plateMax();
  $('limit').textContent=max;
  $('spdNow').classList.toggle('over',S.speed>max+2);

  if(best.d>Math.max(35,S.acc*1.5)){ // van de route af
    S.off++;if(S.off>=3&&!S.busy&&Date.now()-S.lastReroute>12000)reroute();
    return;
  }
  S.off=0;S.idx=best.i;

  const along=S.cum[best.i]+best.t*(S.cum[best.i+1]-S.cum[best.i]);
  const total=S.cum[S.cum.length-1],remain=Math.max(0,total-along);
  let mi=S.man.findIndex(m=>m.begin_shape_index>best.i);if(mi<0)mi=S.man.length-1;
  const m=S.man[mi],dTo=Math.max(0,S.cum[Math.min(m.begin_shape_index,S.cum.length-1)]-along);

  let tRem=0;for(let j=mi;j<S.man.length;j++)tRem+=S.man[j].time||0;
  const cur=S.man[mi-1];if(cur&&cur.length>0)tRem+=cur.time*Math.min(1,dTo/(cur.length*1000));

  // afslagpaneel
  $('iIcon').innerHTML=arrowSVG(m.type);
  $('iDist').textContent=fmtD(dTo);
  const isDest=m.type>=4&&m.type<=6;
  const names=m.street_names?.length?m.street_names.join(' / '):(m.begin_street_names?.join(' / ')||'');
  $('iStreet').textContent=isDest?S.destName:(names||m.instruction);
  $('iSub').textContent=isDest?'Bestemming':(names?m.instruction:'');
  const nx=S.man[mi+1];
  if(nx&&!isDest&&(S.cum[Math.min(nx.begin_shape_index,S.cum.length-1)]-S.cum[m.begin_shape_index])<150){$('iThenIcon').innerHTML=arrowSVG(nx.type);$('iThen').classList.remove('hide')}
  else $('iThen').classList.add('hide');

  // huidige straat + onderbalk
  const cs=cur?.street_names?.join(' / ')||'';
  $('curStreet').textContent=cs;$('curStreet').classList.toggle('hide',!cs);
  $('sEta').textContent=clock(tRem);
  $('sTime').textContent=fmtT(tRem);
  $('sDist').textContent=fmtD(remain);
  $('progFill').style.height=(100*along/total).toFixed(1)+'%';

  // gereden stuk grijs
  if(map.getSource('route')){
    const cut=[p[1],p[0]];
    map.getSource('done').setData({type:'Feature',geometry:{type:'LineString',coordinates:[...toLngLat(sh.slice(0,best.i+1)),cut]}});
    map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:[cut,...toLngLat(sh.slice(best.i+1))]}});
  }

  // gesproken aanwijzingen
  const far=settings.type==='snor'?150:300,near=settings.type==='snor'?30:45;
  const an=S.announced[mi]||(S.announced[mi]={});
  if(!an.far&&dTo<=far&&dTo>near*2.5){an.far=1;say(`Over ${sayD(dTo)}, ${lc(m.verbal_transition_alert_instruction||m.instruction)}`)}
  if(!an.near&&dTo<=near){an.near=1;an.far=1;say(m.verbal_pre_transition_instruction||m.instruction)}

  if(remain<25||(isDest&&dTo<20)){
    say('Je bent op je bestemming');toast('🏁 Bestemming bereikt',3500);setTimeout(stopNav,1500);
  }
}
async function reroute(){
  if(!navigator.onLine){if(Date.now()-S.lastReroute>30000){S.lastReroute=Date.now();toast('Geen internet – keer terug naar de blauwe route',3000)}return}
  S.busy=true;S.lastReroute=Date.now();toast('Route herberekenen…',1500);
  try{const rt=await fetchRoute(S.pos,S.dest,true);applyRoute(rt);S.announced[0]={far:1,near:1};say('Route aangepast')}
  catch(e){toast('Herberekenen mislukt')}
  S.busy=false;
}
if('speechSynthesis' in window)speechSynthesis.getVoices();
const TH={auto:['🌓','Kaart: automatisch'],day:['☀️','Kaart: dag'],night:['🌙','Kaart: nacht']};
function themeLabel(){$('themeBtn').textContent=TH[settings.theme][0];$('mTheme').textContent=TH[settings.theme][0]+' Kaart & helderheid'}
function setTheme(t){settings.theme=t;store('sn_set',settings);themeLabel();syncPanel();
  const u=styleUrl();if(map._curStyle!==u){map._curStyle=u;map.setStyle(u,{diff:false})}}
function applyBright(){document.documentElement.style.setProperty('--br',settings.bright/100);$('brVal').textContent=settings.bright+'%'}
function syncPanel(){document.querySelectorAll('#segTheme button').forEach(b=>b.classList.toggle('on',b.dataset.v===settings.theme));$('brRange').value=settings.bright;applyBright()}
function openPanel(){$('navMenu').classList.add('hide');syncPanel();$('mapPanel').classList.remove('hide')}
document.querySelectorAll('#segTheme button').forEach(b=>b.onclick=()=>setTheme(b.dataset.v));
$('brRange').oninput=e=>{settings.bright=+e.target.value;applyBright()};
$('brRange').onchange=()=>store('sn_set',settings);
$('mpClose').onclick=()=>{store('sn_set',settings);$('mapPanel').classList.add('hide')};
map._curStyle=styleUrl();themeLabel();applyBright();$('themeBtn').onclick=openPanel;$('mTheme').onclick=openPanel;
function netState(){$('offline').classList.toggle('hide',navigator.onLine)}
addEventListener('online',netState);addEventListener('offline',netState);netState();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
